<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a1623">
  <title>飞翔小鸟｜钊的工具箱</title>
  <link rel="stylesheet" href="../shared/toolbox-ui.css">
  <link rel="stylesheet" href="../shared/toolbox-motion.css">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#08121d;--panel:rgba(14,25,38,.78);--line:rgba(255,255,255,.09);
      --text:#f5f8fd;--muted:#8fa1b6;--cyan:#69d8e8;--cyan2:#3bb8cd;--warm:#f6c77f;
      --shadow:0 28px 70px rgba(0,0,0,.34);--flight-halo:rgba(105,216,232,.12);
      --ease-enter:cubic-bezier(.22,1,.36,1);--ease-press:cubic-bezier(.2,.8,.2,1)
    }
    body[data-flight-skin="warm"]{--flight-halo:rgba(231,177,117,.12)}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
    body{
      min-height:100dvh;
      padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
      background:
        radial-gradient(circle at 16% 0%,rgba(72,180,211,.17),transparent 34%),
        radial-gradient(circle at 100% 32%,rgba(114,114,210,.11),transparent 28%),
        linear-gradient(180deg,#0c1a28 0%,#071019 100%);
    }
    button{font:inherit}
    .app{width:min(100%,520px);margin:0 auto;display:flex;flex-direction:column;gap:10px}
    .topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
    .back,.icon-btn{
      height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);
      color:var(--text);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
      font-weight:850;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
    }
    .back{padding:0 13px}
    .top-actions{display:flex;gap:8px}
    .icon-btn{width:44px;padding:0;cursor:pointer;transition:transform 110ms var(--ease-press),background 180ms var(--ease-enter),border-color 180ms var(--ease-enter),opacity 180ms var(--ease-enter)}
    .icon-btn:active{transform:scale(.94)}
    .icon-btn[disabled]{opacity:.34;pointer-events:none}
    .icon-btn.active{background:rgba(105,216,232,.11);border-color:rgba(105,216,232,.28);color:#b8f5ff}
    .heading{display:flex;align-items:end;justify-content:space-between;gap:16px;padding:2px 2px 0}
    h1{margin:0;font-size:clamp(32px,8vw,44px);line-height:1;letter-spacing:-.045em}
    .sub{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
    .score-chips{display:flex;gap:7px;flex:0 0 auto}
    .best-chip{min-width:70px;border:1px solid var(--line);border-radius:15px;padding:8px 10px;text-align:center;background:rgba(255,255,255,.035);color:var(--text)}
    .best-chip span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em}
    .best-chip b{display:block;margin-top:1px;font-size:19px}
    .rank-chip{cursor:pointer;transition:transform 110ms var(--ease-press),border-color 180ms var(--ease-enter),background 180ms var(--ease-enter)}
    .rank-chip:active{transform:scale(.96)}
    .rank-chip.online{border-color:rgba(105,216,232,.24);background:rgba(105,216,232,.07)}
    .stage-wrap{display:flex;justify-content:center}
    .stage{
      position:relative;width:min(100%,420px);aspect-ratio:9/15.1;border-radius:30px;padding:7px;
      border:1px solid rgba(180,215,226,.17);background:rgba(7,16,25,.86);box-shadow:0 0 0 1px rgba(255,255,255,.018),0 22px 65px rgba(0,0,0,.36),0 0 36px var(--flight-halo);
      overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate
    }
    .stage::after{content:"";position:absolute;z-index:2;pointer-events:none;inset:7px;border-radius:23px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.065),inset 0 14px 24px rgba(5,10,18,.13),inset 0 -20px 34px rgba(3,9,17,.20)}
    canvas{
      display:block;width:100%;height:100%;border-radius:23px;background:#0c2031;
      touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none
    }
    .score{
      position:absolute;z-index:3;top:26px;left:50%;transform:translateX(-50%);
      min-width:60px;text-align:center;font-size:42px;line-height:1;font-weight:950;letter-spacing:-.04em;
      text-shadow:0 3px 18px rgba(0,0,0,.34);pointer-events:none;transition:opacity 160ms var(--ease-enter);
      font-variant-numeric:tabular-nums
    }
    .score.bump{animation:scoreBump 130ms var(--ease-enter)}
    .score.hidden{opacity:0}
    .new-best{
      position:absolute;z-index:3;top:76px;left:50%;transform:translate(-50%,-4px);
      color:#ffe1a0;font-size:10px;font-weight:950;letter-spacing:.13em;opacity:0;pointer-events:none
    }
    .new-best.show{animation:newBest 780ms var(--ease-enter) both}
    .ready-layer,.pause-layer,.result-layer{position:absolute;z-index:4;inset:7px;border-radius:23px}
    .ready-layer{
      display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
      background:linear-gradient(180deg,rgba(7,18,28,.10),rgba(4,10,16,.42));
      backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
      transition:opacity 180ms var(--ease-enter),visibility 180ms
    }
    .ready-layer.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .ready-card{transform:translateY(-8px);pointer-events:none}
    .bird-mark{font-size:11px;font-weight:950;letter-spacing:.16em;color:#9edce7}
    .ready-card h2{margin:10px 0 6px;font-size:27px}
    .ready-card p{margin:0;color:#a6b8c9;font-size:13px;line-height:1.7}
    .tap-hint{
      display:inline-flex;align-items:center;gap:7px;margin-top:15px;padding:8px 11px;border-radius:999px;
      border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#d8e6f0;font-size:11px;font-weight:850
    }
    .pause-layer{
      display:flex;align-items:center;justify-content:center;text-align:center;
      background:rgba(5,12,19,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      opacity:0;visibility:hidden;pointer-events:none;transition:opacity 170ms var(--ease-enter),visibility 170ms
    }
    .pause-layer.active{opacity:1;visibility:visible}
    .pause-card{padding:18px 20px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(12,23,35,.72)}
    .pause-card strong{display:block;font-size:22px}.pause-card span{display:block;margin-top:5px;color:#9fb0c1;font-size:11px}
    .result-layer{
      display:flex;align-items:flex-end;justify-content:center;padding:16px;
      pointer-events:none;opacity:0;visibility:hidden;transition:opacity 220ms var(--ease-enter),visibility 220ms
    }
    .result-layer.active{opacity:1;visibility:visible;pointer-events:auto}
    .result-card{
      width:100%;padding:19px;border:1px solid rgba(255,255,255,.055);border-radius:24px;
      background:linear-gradient(180deg,rgba(17,32,46,.88),rgba(8,18,28,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      box-shadow:inset 0 1px rgba(255,255,255,.065),0 22px 55px rgba(0,0,0,.34);transform:translateY(22px) scale(.985);opacity:0;
      transition:transform 260ms var(--ease-enter),opacity 200ms var(--ease-enter)
    }
    .result-layer.active .result-card{transform:none;opacity:1}
    .result-layer.personal-best .result-card{box-shadow:inset 0 1px rgba(255,248,215,.12),0 22px 55px rgba(0,0,0,.34),0 0 0 1px rgba(234,193,136,.10)}
    .result-layer.personal-best .result-title strong{color:#ffdda7}
    .result-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .result-title small{display:block;color:#a6b6c5;font-size:11px;font-weight:850;letter-spacing:.12em}
    .result-title strong{display:block;margin-top:3px;font-size:22px}
    .medal{position:relative;overflow:hidden;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.045);box-shadow:inset 0 1px rgba(255,255,255,.07);font-size:23px}
    .medal.shine::after{content:"";position:absolute;inset:-12px;width:15px;background:linear-gradient(90deg,transparent,rgba(255,245,205,.72),transparent);transform:translateX(-42px) rotate(24deg);animation:medalShine 520ms 150ms var(--ease-enter) both}
    .result-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
    .result-stat{padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.045);background:rgba(255,255,255,.028);box-shadow:inset 0 1px rgba(255,255,255,.035)}
    .result-stat.primary{background:rgba(105,216,232,.07);border-color:rgba(105,216,232,.10);padding:13px 12px}
    .result-stat span{display:block;color:#a6b8c9;font-size:11px;font-weight:800}.result-stat b{display:block;margin-top:2px;font-size:25px;font-variant-numeric:tabular-nums}.result-stat.primary b{font-size:29px;color:#eefeff}
    .online-result-status{display:flex;align-items:center;justify-content:center;gap:6px;min-height:22px;margin:-3px 2px 10px;color:#90a3b7;font-size:10px;line-height:1.5;text-align:center}
    .online-result-status.synced{color:#9be6d1}.online-result-status.syncing{color:#a9dce5}.online-result-status.offline{color:#efc990}
    .online-result-status.synced::before{content:'✓'}.online-result-status.syncing::before{content:'↻';animation:statusSpin 850ms linear infinite}.online-result-status.offline::before{content:'○'}
    .retry{
      width:100%;min-height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,#86e9f3,#47bfd4);
      color:#082430;font-weight:950;font-size:15px;box-shadow:0 13px 28px rgba(65,197,218,.18);cursor:pointer;
      transition:transform 110ms var(--ease-press),filter 180ms var(--ease-enter),box-shadow 180ms var(--ease-enter)
    }
    .retry:active{transform:scale(.985)}
    .retry:hover{filter:brightness(1.035);box-shadow:0 15px 31px rgba(65,197,218,.22)}
    .footer-note{text-align:center;color:#687b8f;font-size:10px;line-height:1.55}
    .leaderboard-layer{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:18px max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));opacity:0;visibility:hidden;transition:opacity 180ms var(--ease-enter),visibility 180ms}
    .leaderboard-layer.active{opacity:1;visibility:visible}
    .leaderboard-backdrop{position:absolute;inset:0;border:0;background:rgba(3,8,13,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .leaderboard-sheet{position:relative;width:min(100%,500px);max-height:min(82dvh,720px);overflow:auto;border:1px solid rgba(255,255,255,.10);border-radius:26px;background:rgba(10,22,34,.96);box-shadow:0 28px 80px rgba(0,0,0,.48);padding:18px;transform:translateY(18px);transition:transform 230ms var(--ease-enter)}
    .leaderboard-layer.active .leaderboard-sheet{transform:none}
    .leaderboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
    .leaderboard-head small{display:block;color:#79dce9;font-size:9px;font-weight:950;letter-spacing:.14em}.leaderboard-head h2{margin:4px 0 0;font-size:24px}
    .sheet-close{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);color:var(--text);font-size:20px;cursor:pointer}
    .leaderboard-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:16px 0 12px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04)}
    .leaderboard-tabs button{min-height:38px;border:0;border-radius:11px;background:transparent;color:#8397aa;font-size:12px;font-weight:900;cursor:pointer}.leaderboard-tabs button.active{background:rgba(105,216,232,.11);color:#baf5fb}
    .leaderboard-list{display:grid;gap:7px;min-height:120px}
    .leaderboard-row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px;padding:10px 11px;border:1px solid rgba(255,255,255,.065);border-radius:15px;background:rgba(255,255,255,.025)}
    .leaderboard-row.me{border-color:rgba(105,216,232,.25);background:rgba(105,216,232,.065)}
    .rank-number{font-size:14px;font-weight:950;text-align:center}.player-name{font-size:13px;font-weight:900}.player-detail{margin-top:2px;color:#9aafc0;font-size:10px}.player-score{font-size:20px;font-weight:950}
    .leaderboard-empty{display:grid;place-items:center;min-height:120px;color:#71869a;font-size:12px;text-align:center}
    .account-panel{margin-top:13px;padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:17px;background:rgba(255,255,255,.026)}
    .account-copy{color:#91a5b8;font-size:10px;line-height:1.6}.account-copy strong{color:#e8f4f7}
    .login-form{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:9px}.login-form input{min-width:0;height:42px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(4,12,19,.65);color:var(--text);padding:0 11px;font:inherit;font-size:12px}.login-form button,.signout-btn{height:42px;border:0;border-radius:12px;background:#69d8e8;color:#082630;padding:0 14px;font-size:12px;font-weight:950;cursor:pointer}.signout-btn{height:32px;margin-left:7px;background:rgba(255,255,255,.07);color:#b7c6d3}
    .login-error{min-height:15px;margin-top:6px;color:#e9a6a6;font-size:10px}
    :where(a,button):focus-visible{outline:3px solid rgba(105,216,232,.58);outline-offset:3px}
    @keyframes scoreBump{46%{transform:translateX(-50%) scale(1.06)}}
    @keyframes newBest{0%{opacity:0;transform:translate(-50%,3px)}18%,68%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-5px)}}
    @keyframes medalShine{to{transform:translateX(72px) rotate(24deg)}}
    @keyframes statusSpin{to{transform:rotate(360deg)}}
    @media(max-height:760px) and (orientation:portrait){
      .app{gap:7px}.heading h1{font-size:29px}.sub{display:none}.stage{width:min(100%,49dvh)}.footer-note{display:none}
    }
    @media(orientation:landscape) and (max-height:620px){
      .app{width:min(100%,880px);display:grid;grid-template-columns:minmax(270px,58vh) minmax(250px,1fr);grid-template-rows:auto auto 1fr;column-gap:18px}
      .topbar{grid-column:1/3}.heading{grid-column:2;grid-row:2;align-self:start}.stage-wrap{grid-column:1;grid-row:2/4}
      .stage{width:min(58vh,350px)}.footer-note{grid-column:2;grid-row:3;align-self:end}.heading{display:block}.score-chips{margin-top:14px}.best-chip{width:90px}
    }
    @media(max-width:430px){.login-form{grid-template-columns:1fr}.login-form button{width:100%}.heading{gap:8px}.best-chip{min-width:64px;padding:8px 7px}}
    @media(prefers-reduced-motion:reduce){
      .score.bump,.new-best.show,.medal.shine::after,.online-result-status.syncing::before{animation:none!important}.ready-layer,.pause-layer,.result-layer,.result-card,.leaderboard-layer,.leaderboard-sheet{transition:none!important}
    }
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="https://v1t0777.github.io/tools/games/" aria-label="返回小游戏">← 小游戏</a>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" aria-label="切换音效">♪</button>
        <button class="icon-btn" id="pauseBtn" aria-label="暂停或继续" disabled>Ⅱ</button>
      </div>
    </div>

    <div class="heading">
      <div>
        <h1>飞翔小鸟</h1>
        <p class="sub">轻触扑翼 · 穿过障碍 · 节奏会逐渐加快</p>
      </div>
      <div class="score-chips">
        <div class="best-chip"><span>本地 BEST</span><b id="bestTop">0</b></div>
        <button class="best-chip rank-chip" id="leaderboardBtn" aria-label="打开好友排行榜"><span>好友榜</span><b id="rankTop">--</b></button>
      </div>
    </div>

    <div class="stage-wrap">
      <section class="stage" id="stage" aria-label="飞翔小鸟游戏区域">
        <canvas id="canvas"></canvas>
        <div class="score hidden" id="score">0</div>
        <div class="new-best" id="newBest">NEW BEST</div>

        <div class="ready-layer" id="readyLayer">
          <div class="ready-card">
            <div class="bird-mark">RANDOM FLIGHT</div>
            <h2>准备起飞</h2>
            <p>每局随机遇见暖棕旅鸟或板岩夜鸟。轻触画面开始。</p>
            <div class="tap-hint">轻触任意位置</div>
          </div>
        </div>

        <div class="pause-layer" id="pauseLayer">
          <div class="pause-card"><strong>已暂停</strong><span>点击右上角继续</span></div>
        </div>

        <div class="result-layer" id="resultLayer">
          <div class="result-card">
            <div class="result-top">
              <div class="result-title"><small>FLIGHT REPORT</small><strong id="resultTitle">本局结束</strong></div>
              <div class="medal" id="medal">·</div>
            </div>
            <div class="result-stats">
              <div class="result-stat primary"><span>本局得分</span><b id="resultScore">0</b></div>
              <div class="result-stat"><span>本地最高</span><b id="resultBest">0</b></div>
              <div class="result-stat"><span>在线最好</span><b id="resultOnlineBest">--</b></div>
              <div class="result-stat"><span>好友排名</span><b id="resultOnlineRank">--</b></div>
            </div>
            <div class="online-result-status" id="onlineResultStatus">登录工具箱后，新完成的成绩可进入好友榜</div>
            <button class="retry" id="retryBtn">再来一局</button>
          </div>
        </div>
      </section>
    </div>

    <div class="footer-note">支持触摸、鼠标、空格键 / ↑ / W。页面切到后台会自动暂停。</div>
  </main>

  <div class="leaderboard-layer" id="leaderboardLayer" aria-hidden="true">
    <button class="leaderboard-backdrop" id="leaderboardBackdrop" aria-label="关闭排行榜"></button>
    <section class="leaderboard-sheet" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
      <div class="leaderboard-head">
        <div><small>ONLINE FRIENDS</small><h2 id="leaderboardTitle">好友排行榜</h2></div>
        <button class="sheet-close" id="leaderboardClose" aria-label="关闭">×</button>
      </div>
      <div class="leaderboard-tabs" role="tablist">
        <button class="active" id="allTimeTab" role="tab" aria-selected="true">总榜</button>
        <button id="weeklyTab" role="tab" aria-selected="false">本周</button>
      </div>
      <div class="leaderboard-list" id="leaderboardList"><div class="leaderboard-empty">正在读取好友成绩…</div></div>
      <div class="account-panel" id="accountPanel">
        <div class="account-copy" id="accountCopy">未登录也可以正常游玩；登录后新完成的有效成绩会自动提交。</div>
        <form class="login-form" id="leaderboardLoginForm">
          <input id="leaderboardEmail" type="email" autocomplete="username" placeholder="邮箱" aria-label="邮箱" required>
          <input id="leaderboardPassword" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码" required>
          <button type="submit">登录</button>
        </form>
        <div class="login-error" id="leaderboardLoginError"></div>
      </div>
    </section>
  </div>

  function forgetRun(run){

  function restorePendingRuns(){
    var now=Date.now(),stored=readStoredRuns(),kept=[];pendingRuns=[];
    stored.forEach(function(item){
      if(!item||!item.payload||!item.userId)return;

      kept.push(item);

  function requestTimeout(ms){
    var controller=new AbortController();

  }
  async function onlineApi(action,payload,requireAuth){
    var auth=null;
    try{auth=await ToolboxAuth.getSession();}catch(e){if(requireAuth)throw e;}
    if(requireAuth&&!auth)throw Object.assign(new Error('请先登录'),{code:'AUTH_REQUIRED',status:401});
    var timeout=requestTimeout(8000);
    try{
      var headers={'Content-Type':'application/json','apikey':ToolboxAuth.key};
      if(auth&&auth.access_token)headers.Authorization='Bearer '+auth.access_token;
      var response=await fetch(FUNCTION_URL,{method:'POST',cache:'no-store',signal:timeout.controller.signal,headers:headers,body:JSON.stringify(Object.assign({action:action},payload||{}))});
      var data=await response.json().catch(function(){return {};});
      if(!response.ok||data.error)throw Object.assign(new Error(data.error||'线上服务暂时不可用'),{status:response.status,code:data.code});
      return data;
    }catch(error){
      if(error&&error.name==='AbortError')throw Object.assign(new Error('网络超时，单机成绩已正常保存'),{code:'NETWORK_TIMEOUT'});
      throw error;
    }finally{timeout.clear();}
  }

  function renderLeaderboard(){

    var viewerId=leaderboardData.viewer&&leaderboardData.viewer.member_id;

      var date='';try{date=new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric'}).format(new Date(row.achieved_at));}catch(e){}
      return '<div class="leaderboard-row '+(row.member_id===viewerId?'me':'')+'"><div class="rank-number">'+medalText+'</div><div><div class="player-name"><span style="color:'+color+'">●</span> '+escapeHTML(row.nickname)+'</div><div class="player-detail">'+skin+(date?' · '+date:'')+'</div></div><div class="player-score">'+escapeHTML(row.score)+'</div></div>';

  async function submitOnlineRun(finalScore,durationMs,skin){
    var run=activeRun;
    var issued=run?await run.promise:null;
    if(!run||run.epoch!==authEpoch)return;
    if(!issued){
      if(run.error?.code==='LEADERBOARD_EXCLUDED'||run.error?.code==='TEST_ACCOUNT_EXCLUDED'){
        clearPendingBestThrough(Number.MAX_SAFE_INTEGER);setSyncStatus('离线保存','测试账号不参与排名，本地 BEST 正常保留');
      }else setSyncStatus('离线保存',ToolboxAuth.peekSession()?pendingBest+' 分已保存在本机，联网后自动重试':'登录后新完成的成绩可进入好友榜');
      return;
    }
    run.payload={run_token:issued.run_token,score:finalScore,duration_ms:durationMs,bird_skin:skin,game_version:GAME_VERSION};
    run.expiresAt=issued.expires_at||null;
    pendingRuns.push(run);pendingRuns=pendingRuns.slice(-5);
    persistRun(run);
    await sendRun(run);
  }
  async function sendRun(run){
    if(run.busy||run.epoch!==authEpoch||run.attempts>=2)return;
    run.busy=true;run.attempts++;
    function message(mode,detail){if((run===activeRun||resultLayer.classList.contains('active'))&&run.epoch===authEpoch)setSyncStatus(mode,detail);}
    message('正在同步','正在验证成绩');
    try{
      var response=await onlineApi('submit_run',run.payload,true);
      pendingRuns=pendingRuns.filter(function(item){return item!==run;});
      forgetRun(run);
      if(run.epoch!==authEpoch)return;
      if(run===activeRun){++leaderboardRequest;applyLeaderboard(response.leaderboard);}else refreshLeaderboard(true);
      var personal=personalFrom(response.leaderboard);
      var fullySynced=reconcilePendingBest(personal);
      if(fullySynced)message('已同步',personal?'线上最好 '+personal.score+'，当前第 '+personal.rank+' 名':'成绩已验证');
      else message('离线保存',pendingBest+' 分仍在本机等待有效局补传');
    }catch(error){
      if(error.status>=400&&error.status<500){pendingRuns=pendingRuns.filter(function(item){return item!==run;});
        forgetRun(run);
        if(error.code==='RUN_ALREADY_SUBMITTED'){await refreshLeaderboard(true);message(pendingBest?'离线保存':'已同步',pendingBest?pendingBest+' 分仍在本机':'线上排名已刷新');}
        else message('离线保存',error.message+'；本地 BEST 正常保留');
      }else message('离线保存',pendingBest+' 分已保存在本机，联网后自动重试');
    }finally{run.busy=false;}
  }
  function retryPendingSubmission(){pendingRuns.slice().forEach(function(run){if(!run.busy&&run.attempts<2)sendRun(run);});}

  function initAudio(){
    if(!soundOn)return null;
    if(!audioCtx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC)audioCtx=new AC();
    }
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }
  function tone(freq,dur,type,vol,endFreq){
    var ac=initAudio();if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,ac.currentTime);
    if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,ac.currentTime+dur);
    g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.linearRampToValueAtTime(vol||.025,ac.currentTime+.004);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }
  function airy(cutoff,volume,duration){
    var ac=initAudio();if(!ac||!ac.createBuffer||!ac.createBufferSource||!ac.createBiquadFilter)return;
    if(!noiseBuffer){
      noiseBuffer=ac.createBuffer(1,Math.round(ac.sampleRate*.16),ac.sampleRate);
      var samples=noiseBuffer.getChannelData(0);
      for(var i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
    }
    var source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
    source.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.value=cutoff;
    gain.gain.setValueAtTime(Math.max(.0001,volume),ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);
    source.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    source.start();source.stop(ac.currentTime+duration);
  }
  function thump(){
    var ac=initAudio();if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(105,ac.currentTime);o.frequency.exponentialRampToValueAtTime(58,ac.currentTime+.11);
    g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.13);
  }

  function startGame(){

  function flap(){
    if(state!=='running')return;
    var flapPower=H*.69;
    bird.vy=Math.min(bird.vy,0)*.12-flapPower;
    bird.wing=1;bird.flapAge=0;

  }

  function pauseGame(){

  function togglePause(){
    if(state==='running')pauseGame();
    else if(state==='paused')resumeGame();
  }

  function difficulty(){
    var s=Math.min(score,45);
    return{
      speed:W*(.41+s*.0028),
      gap:Math.max(H*.205,H*.255-s*.85),
      spacing:Math.max(W*.50,W*.60-s*.0018*W)
    };
  }

  function nextGap(gap){
    var marginTop=H*.12+gap*.5;
    var marginBottom=groundY-H*.08-gap*.5;
    var center;
    if(prevGapY==null) center=H*.42;
    else center=prevGapY+(Math.random()*2-1)*H*.145;
    center=clamp(center,marginTop,marginBottom);
    prevGapY=center;
    return center;
  }

  function addPipe(x){
    var d=difficulty(),gap=d.gap,gapY=nextGap(gap);
    pipes.push({x:x,gapY:gapY,gap:gap,passed:false});
  }
  function spawnInitialPipes(){
    var d=difficulty();
    addPipe(W*1.18);
    addPipe(W*1.18+d.spacing);
  }

  function update(dt,now){
    if(state==='ready'){
      elapsed+=dt;bird.y=H*.45+(reduceMotion?0:Math.sin(elapsed*2.2)*H*.008);bird.rot=Math.sin(elapsed*1.5)*.025;
      if(!reduceMotion)scroll+=W*.025*dt;return;
    }
    if(state==='paused'||state==='over')return;

    if(state==='falling'){
      var fallDt=now<hitSlowUntil&&!reduceMotion?dt*.18:dt;
      bird.vy=Math.min(H*.98,bird.vy+H*2.45*fallDt);
      bird.y+=bird.vy*fallDt;
      bird.rot=Math.min(1.22,bird.rot+2.7*fallDt);
      if(bird.y+birdRadius()>=groundY){
        bird.y=groundY-birdRadius();
        if(!groundHitAt){
          groundHitAt=now;bird.squash=.12;thump();haptic(30);
        }
        if(now-groundHitAt>180)finishGame();
      }
      return;
    }

    elapsed+=dt;
    var d=difficulty();
    scroll+=d.speed*dt;

    bird.vy=Math.min(H*.96,bird.vy+H*2.45*dt);
    bird.y+=bird.vy*dt;
    var targetRot=bird.vy<0?-0.38:clamp(bird.vy/(H*.78),0,1)*1.24;
    bird.rot+=(targetRot-bird.rot)*Math.min(1,dt*8.5);
    bird.wing=Math.max(0,bird.wing-dt*6.5);
    bird.flapAge=Math.min(1,bird.flapAge+dt);
    bird.tailLag+=(clamp(bird.vy/(H*.8),-.55,.8)-bird.tailLag)*Math.min(1,dt*7.5);
    bird.squash=Math.max(0,bird.squash-dt*5.5);

    for(var i=0;i<pipes.length;i++){
      pipes[i].x-=d.speed*dt;
      if(!pipes[i].passed&&pipes[i].x+pipeWidth()<bird.x-birdRadius()){
        pipes[i].passed=true;score++;scoreEl.textContent=String(score);
        scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump');
        tone(620,.068,'sine',.024,760);
        if(score>best&&!newRecord){
          newRecord=true;newBestEl.classList.remove('show');void newBestEl.offsetWidth;newBestEl.classList.add('show');
          tone(880,.12,'triangle',.025);haptic([12,18,12]);
        }
      }
    }
    while(pipes.length&&pipes[0].x+pipeWidth()<-10)pipes.shift();
    var last=pipes[pipes.length-1];
    if(last&&last.x<W-d.spacing)addPipe(last.x+d.spacing);

    if(collides()){
      state='falling';hitSlowUntil=now+(reduceMotion?0:250);bird.vy=Math.max(bird.vy,H*.12);
      thump();airy(350,.012,.10);haptic(24);
    }
  }

  function birdRadius(){return Math.max(13,W*.043);}
  function pipeWidth(){return clamp(W*.155,48,68);}
  function collides(){
    var r=birdRadius(),bx=bird.x,by=bird.y;
    if(by-r<0||by+r>=groundY)return true;
    var pw=pipeWidth();
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i],gap=p.gap;
      if(bx+r>p.x&&bx-r<p.x+pw){
        var topEnd=p.gapY-gap*.5,bottomStart=p.gapY+gap*.5;
        if(by-r<topEnd||by+r>bottomStart)return true;
      }
    }
    return false;
  }

  function finishGame(){
    state='over';pauseBtn.disabled=true;pauseBtn.textContent='Ⅱ';pauseBtn.classList.remove('active');
    var record=saveBest();
    var personal=personalFrom(leaderboardData),onlineBest=personal?personal.score:0;
    if(!leaderboardData?.excluded_account&&score>onlineBest)rememberPendingBest(score);
    resultScore.textContent=String(score);resultBest.textContent=String(best);
    resultTitle.textContent=record?'新纪录！':'本局结束';
    medal.textContent=score>=70?'💎':score>=40?'🥇':score>=20?'🥈':score>=10?'🥉':'·';
    medal.classList.remove('shine');if(record&&!reduceMotion){void medal.offsetWidth;medal.classList.add('shine');}
    resultLayer.classList.toggle('personal-best',record);
    resultLayer.classList.add('active');
    setSyncStatus('正在同步','正在验证本局成绩');
    submitOnlineRun(score,Math.max(250,Math.round(elapsed*1000)),birdSkin);
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(state==='falling'&&now<hitSlowUntil&&!reduceMotion){
      var force=clamp((hitSlowUntil-now)/250,0,1);ctx.translate(Math.sin(now*.095)*1.6*force,Math.cos(now*.073)*.8*force);
    }
    drawBackground();
    drawClouds();
    drawRidges();
    drawPipes();
    drawGround();
    drawAirflow();
    drawBird(now);
    ctx.restore();
  }

  function buildCloudSprite(){
    cloudSprite=null;
    if(!document.createElement)return;
    var sprite=document.createElement('canvas');sprite.width=360;sprite.height=144;
    var c=sprite.getContext('2d');if(!c)return;
    c.fillStyle='#f0f8f8';
    if('filter' in c)c.filter='blur(3px)';
    c.beginPath();
    c.ellipse(100,76,79,29,0,0,Math.PI*2);
    c.ellipse(151,63,62,40,0,0,Math.PI*2);
    c.ellipse(204,77,83,27,0,0,Math.PI*2);
    c.fill();
    cloudSprite=sprite;
  }
  function drawBackground(){
    var key=birdSkin+':'+Math.min(6,Math.floor(score/12))+':'+W+':'+H+':'+dpr;
    if(!skyCache||skyCacheKey!==key){
      if(document.createElement){
        skyCache=document.createElement('canvas');
        skyCache.width=Math.round(W*dpr);skyCache.height=Math.round(H*dpr);
        var c=skyCache.getContext('2d');
        if(c){
          c.setTransform(dpr,0,0,dpr,0,0);
          var p=skies[birdSkin],g=c.createLinearGradient(0,0,0,H);
          g.addColorStop(0,p.top);g.addColorStop(.58,p.mid);g.addColorStop(1,p.bottom);
          c.fillStyle=g;c.fillRect(0,0,W,H);
          var glow=c.createRadialGradient(W*.78,H*.19,0,W*.78,H*.19,W*.83);
          glow.addColorStop(0,p.glow);glow.addColorStop(1,'rgba(255,255,255,0)');
          c.fillStyle=glow;c.fillRect(0,0,W,H);
          var night=Math.min(.25,Math.floor(score/12)*.038);
          if(night){c.fillStyle='rgba(5,13,25,'+night+')';c.fillRect(0,0,W,H);}
          skyCacheKey=key;
        }else skyCache=null;
      }
    }
    if(skyCache)ctx.drawImage(skyCache,0,0,W,H);
    else{ctx.fillStyle='#142c3b';ctx.fillRect(0,0,W,H);}
    ctx.fillStyle='rgba(223,241,247,.065)';
    for(var i=0;i<8;i++){
      var px=((i*.173*W-scroll*.014)%(W*1.18)+W*1.18)%(W*1.18)-W*.08;
      var py=H*(.10+(i%4)*.105);
      ctx.beginPath();ctx.arc(px,py,i%3===0?1.1:.7,0,Math.PI*2);ctx.fill();
    }
  }

  function drawClouds(){
    var travel=scroll*.055;
    for(var i=0;i<clouds.length;i++){
      var c=clouds[i],span=W*2.05;
      var x=((c.x*W-travel)%span+span)%span-W*.2,y=c.y*H,sz=W*.12*c.s;
      ctx.save();ctx.globalAlpha=c.o;
      if(cloudSprite){ctx.drawImage(cloudSprite,x-sz*.7,y-sz*.37,sz*2.15,sz*.86);}
      else{
        ctx.fillStyle='#dff6fb';ctx.beginPath();
        ctx.ellipse(x,y,sz*.62,sz*.24,0,0,Math.PI*2);
        ctx.ellipse(x+sz*.38,y-sz*.08,sz*.44,sz*.28,0,0,Math.PI*2);
        ctx.ellipse(x+sz*.76,y,sz*.58,sz*.22,0,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }

  function ridgeLayer(speed,base,amplitude,fill){
    ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(0,groundY);
    var offset=scroll*speed;
    for(var x=0;x<=W+8;x+=8){
      var world=(x+offset)/W;
      var y=groundY-H*base+Math.sin(world*5.2)*H*amplitude+Math.sin(world*10.6+1.4)*H*amplitude*.28;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W+8,groundY);ctx.closePath();ctx.fill();
  }
  function drawRidges(){
    var palette=skies[birdSkin];
    ridgeLayer(.09,.15,.031,palette.ridgeFar);
    ridgeLayer(.19,.085,.020,palette.ridgeNear);
  }

  function roundedRect(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }

  function pipeStyle(w){
    if(pipeMaterials&&pipeMaterials.width===w)return pipeMaterials;
    var body=ctx.createLinearGradient(0,0,w,0);
    body.addColorStop(0,'#255a50');body.addColorStop(.14,'#357265');
    body.addColorStop(.48,'#31695c');body.addColorStop(.82,'#255447');body.addColorStop(1,'#173b34');
    var cap=ctx.createLinearGradient(-6,0,w+6,0);
    cap.addColorStop(0,'#255d52');cap.addColorStop(.17,'#3b796a');
    cap.addColorStop(.65,'#285d50');cap.addColorStop(1,'#183c34');
    pipeMaterials={width:w,body:body,cap:cap};
    return pipeMaterials;
  }
  function drawPipePart(x,y,w,h,top){
    if(h<=0)return;
    var style=pipeStyle(w),capH=Math.min(24,H*.038),capY=top?h-capH:0;
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle=style.body;ctx.shadowColor='rgba(0,0,0,.19)';ctx.shadowBlur=6;
    roundedRect(0,0,w,h,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(231,255,239,.07)';roundedRect(w*.12,3,w*.06,Math.max(0,h-6),3);ctx.fill();
    ctx.fillStyle='rgba(5,24,21,.15)';roundedRect(w*.84,2,w*.08,Math.max(0,h-4),3);ctx.fill();
    ctx.fillStyle=style.cap;roundedRect(-6,capY,w+12,capH,7);ctx.fill();
    ctx.fillStyle='rgba(226,250,229,.12)';roundedRect(-3,capY+2,w+6,Math.min(2.5,capH*.16),1);ctx.fill();
    ctx.fillStyle='rgba(4,23,20,.12)';roundedRect(-3,capY+capH-3,w+6,2,1);ctx.fill();
    ctx.restore();
  }

  function drawPipes(){
    var pw=pipeWidth();
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i],gap=p.gap,topEnd=p.gapY-gap*.5,bottomStart=p.gapY+gap*.5;
      drawPipePart(p.x,-8,pw,topEnd+8,true);
      drawPipePart(p.x,bottomStart,pw,groundY-bottomStart+8,false);
    }
  }

  function drawGround(){
    var h=H-groundY;
    var g=ctx.createLinearGradient(0,groundY,0,H);
    g.addColorStop(0,'#132b2b');g.addColorStop(1,'#091a20');
    ctx.fillStyle=g;ctx.fillRect(0,groundY,W,h);
    var lg=ctx.createLinearGradient(0,groundY,0,groundY+13);
    lg.addColorStop(0,'rgba(168,232,211,.20)');lg.addColorStop(1,'rgba(168,232,211,0)');
    ctx.fillStyle=lg;ctx.fillRect(0,groundY,W,13);
    ctx.strokeStyle='rgba(197,226,213,.065)';ctx.lineWidth=1.3;
    var off=-(scroll*.58%30);
    for(var x=off;x<W+30;x+=30){
      ctx.beginPath();ctx.moveTo(x,groundY+15);ctx.lineTo(x+11,groundY+26);ctx.stroke();
    }
  }
  function drawAirflow(){
    if(reduceMotion||score<12||state!=='running')return;
    var r=birdRadius(),intensity=Math.min(.14,(score-10)*.003);
    ctx.save();ctx.strokeStyle='rgba(209,232,227,'+intensity+')';ctx.lineWidth=1;
    for(var i=0;i<2;i++){
      var x=bird.x-r*(2.5+i*.85),y=bird.y+(i?9:-12)+Math.sin(elapsed*2.5+i)*3;
      ctx.beginPath();ctx.moveTo(x-18,y);ctx.quadraticCurveTo(x,y-2,x+10,y);ctx.stroke();
    }
    ctx.restore();
  }

  function drawBird(now){
    var r=birdRadius(),skin=BIRD_SKINS[birdSkin];
    var t=bird.flapAge;
    // The same four stages (rest/up/down/glide) drive both character skins.
    var flap=t<.075?t/.075:t<.30?1-(t-.075)/.225:0;
    var idle=state==='ready'&&!reduceMotion?Math.sin((now||0)*.005)*.12:0;
    var falling=state==='falling'? .13 : clamp(bird.vy/(H*3),0,.11);
    var wingAngle=-.07-flap*.86+idle+falling;
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.rot);
    var fallStretch=state==='running'?clamp(bird.vy/(H*.92),0,.035):0;
    ctx.scale(1+bird.squash*.30-fallStretch*.30,1-bird.squash*.38+fallStretch);

    // Two short, layered tail feathers with a gentle inertial lag.
    ctx.save();
    ctx.translate(-r*.69,r*.04);
    ctx.rotate(-bird.tailLag*.16);
    ctx.fillStyle=skin.tail;
    ctx.beginPath();
    ctx.moveTo(0,-r*.20);
    ctx.quadraticCurveTo(-r*.52,-r*.39,-r*.85,-r*.37);
    ctx.quadraticCurveTo(-r*.62,-r*.13,-r*.29,-r*.04);
    ctx.quadraticCurveTo(-r*.70,r*.17,-r*.83,r*.24);
    ctx.quadraticCurveTo(-r*.27,r*.36,r*.05,r*.12);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=skin.featherShade;ctx.lineWidth=Math.max(.55,r*.038);
    ctx.beginPath();ctx.moveTo(-r*.12,-r*.04);ctx.quadraticCurveTo(-r*.52,-r*.09,-r*.73,-r*.24);ctx.stroke();
    ctx.restore();

    // Silhouette: continuous tear-drop torso, subtly fuller in front, not a round sticker.
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.19)';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
    var bodyG=ctx.createLinearGradient(-r,-r*.66,r*.93,r*.68);
    bodyG.addColorStop(0,skin.back);bodyG.addColorStop(.46,skin.mid);bodyG.addColorStop(1,skin.belly);
    ctx.fillStyle=bodyG;ctx.beginPath();
    ctx.moveTo(-r*.99,-r*.08);
    ctx.bezierCurveTo(-r*.88,-r*.60,-r*.17,-r*.80,r*.47,-r*.61);
    ctx.bezierCurveTo(r*.83,-r*.54,r*1.02,-r*.23,r*.93,r*.15);
    ctx.bezierCurveTo(r*.79,r*.58,r*.25,r*.75,-r*.33,r*.56);
    ctx.bezierCurveTo(-r*.75,r*.41,-r*1.03,r*.16,-r*.99,-r*.08);
    ctx.closePath();ctx.fill();ctx.restore();

    // Ivory lower breast: broad enough to remain visible when the wing is raised.
    ctx.fillStyle=skin.belly;ctx.beginPath();
    ctx.moveTo(-r*.16,r*.24);
    ctx.bezierCurveTo(r*.06,r*.52,r*.52,r*.57,r*.78,r*.27);
    ctx.bezierCurveTo(r*.76,r*.64,r*.07,r*.79,-r*.29,r*.52);
    ctx.closePath();ctx.fill();

    // Crown and swept nape are a single soft feather cap.
    ctx.fillStyle=skin.crown;ctx.beginPath();
    ctx.moveTo(-r*.34,-r*.47);
    ctx.quadraticCurveTo(-r*.03,-r*.78,r*.40,-r*.70);
    ctx.quadraticCurveTo(r*.83,-r*.64,r*.93,-r*.38);
    ctx.quadraticCurveTo(r*.46,-r*.54,r*.03,-r*.32);
    ctx.closePath();ctx.fill();
    // Small feather crest keeps the profile distinctive without changing its hitbox.
    ctx.beginPath();
    ctx.moveTo(-r*.30,-r*.61);ctx.quadraticCurveTo(-r*.06,-r*.86,r*.08,-r*.70);
    ctx.quadraticCurveTo(-r*.06,-r*.69,-r*.17,-r*.57);ctx.closePath();ctx.fill();

    // Traveller's cream cheek and night bird's silver cheek share the same outline.
    ctx.fillStyle=skin.face;ctx.beginPath();
    ctx.moveTo(r*.16,-r*.43);
    ctx.quadraticCurveTo(r*.43,-r*.59,r*.79,-r*.39);
    ctx.quadraticCurveTo(r*.97,-r*.18,r*.80,r*.08);
    ctx.quadraticCurveTo(r*.49,r*.35,r*.14,r*.03);
    ctx.quadraticCurveTo(r*.38,-r*.15,r*.16,-r*.43);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=skin.throat;ctx.beginPath();
    ctx.moveTo(r*.68,-r*.05);
    ctx.quadraticCurveTo(r*1.05,r*.14,r*.70,r*.44);
    ctx.quadraticCurveTo(r*.38,r*.54,r*.20,r*.29);
    ctx.quadraticCurveTo(r*.58,r*.23,r*.68,-r*.05);
    ctx.closePath();ctx.fill();

    // One articulated wing, made of flight feathers and overlapping coverts.
    ctx.save();
    ctx.translate(-r*.24,-r*.035);
    ctx.rotate(wingAngle);
    var wingG=ctx.createLinearGradient(-r*.49,-r*.45,r*.76,r*.49);
    wingG.addColorStop(0,skin.wingHi);wingG.addColorStop(.56,skin.wing);wingG.addColorStop(1,skin.featherShade);
    ctx.fillStyle=wingG;ctx.beginPath();
    ctx.moveTo(-r*.39,-r*.17);
    ctx.bezierCurveTo(-r*.04,-r*.51,r*.57,-r*.40,r*.73,-r*.09);
    ctx.bezierCurveTo(r*.53,r*.16,r*.10,r*.46,-r*.39,r*.37);
    ctx.quadraticCurveTo(-r*.61,r*.15,-r*.39,-r*.17);
    ctx.closePath();ctx.fill();

    // Three terminal feathers: readable texture even when the rendered bird is tiny.
    for(var i=0;i<3;i++){
      var fx=(-.41+i*.13)*r,fy=(.20+i*.065)*r;
      ctx.fillStyle=i===0?skin.wing:skin.featherShade;
      ctx.beginPath();
      ctx.moveTo(fx-r*.08,fy-r*.10);
      ctx.quadraticCurveTo(fx+r*.16,fy+r*.12,fx+r*.33,fy+r*.12);
      ctx.quadraticCurveTo(fx+r*.07,fy+r*.29,fx-r*.14,fy+r*.14);
      ctx.closePath();ctx.fill();
    }
    ctx.fillStyle=skin.feather;ctx.beginPath();
    ctx.moveTo(-r*.20,-r*.23);
    ctx.bezierCurveTo(r*.10,-r*.42,r*.47,-r*.30,r*.59,-r*.12);
    ctx.quadraticCurveTo(r*.23,-r*.13,-r*.02,r*.04);
    ctx.quadraticCurveTo(-r*.25,r*.14,-r*.20,-r*.23);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=skin.featherShade;ctx.lineWidth=Math.max(.6,r*.042);
    ctx.beginPath();ctx.moveTo(-r*.07,r*.03);
    ctx.quadraticCurveTo(r*.21,-r*.02,r*.43,-r*.14);ctx.stroke();
    ctx.restore();

    // Tiny dark, bright-eyed expression; iris remains restrained at mobile scale.
    ctx.fillStyle=skin.eyering;ctx.beginPath();
    ctx.ellipse(r*.67,-r*.38,r*.188,r*.176,-.18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=skin.iris;ctx.beginPath();
    ctx.arc(r*.684,-r*.387,r*.154,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=skin.eye;ctx.beginPath();
    ctx.arc(r*.702,-r*.389,r*.115,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fffaf3';ctx.beginPath();
    ctx.arc(r*.737,-r*.438,r*.037,0,Math.PI*2);ctx.fill();

    // Short, tapered beak: within the existing visual silhouette / game hit radius.
    ctx.fillStyle=skin.beak;ctx.beginPath();
    ctx.moveTo(r*.90,-r*.16);
    ctx.quadraticCurveTo(r*1.14,-r*.13,r*1.38,-r*.04);
    ctx.quadraticCurveTo(r*1.15,r*.075,r*.90,r*.045);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(42,37,35,.26)';ctx.lineWidth=Math.max(.6,r*.032);
    ctx.beginPath();ctx.moveTo(r*.96,-r*.042);ctx.lineTo(r*1.28,-r*.018);ctx.stroke();

    // Single restrained highlight, not a synthetic all-over glow.
    ctx.fillStyle=skin.shine;ctx.beginPath();
    ctx.ellipse(-r*.18,-r*.53,r*.27,r*.052,-.21,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function frame(t){
    if(!lastTime)lastTime=t;
    var dt=Math.min(.033,(t-lastTime)/1000);lastTime=t;
    update(dt,t);draw(t);raf=requestAnimationFrame(frame);
  }

  function handleAction(e){
    if(e&&e.target&&e.target.closest&&e.target.closest('button,a'))return;
    if(e)e.preventDefault();
    initAudio();
    if(state==='ready'||state==='over')startGame();
    else if(state==='running')flap();
  }

  stage.addEventListener('pointerdown',handleAction,{passive:false});
  ['contextmenu','selectstart','dragstart'].forEach(function(type){stage.addEventListener(type,function(e){e.preventDefault();});});
  retryBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
  pauseBtn.addEventListener('click',function(e){e.stopPropagation();togglePause();});
  soundBtn.textContent=soundOn?'♪':'×';
  soundBtn.classList.toggle('active',!soundOn);
  soundBtn.addEventListener('click',function(e){
    e.stopPropagation();soundOn=!soundOn;soundBtn.textContent=soundOn?'♪':'×';soundBtn.classList.toggle('active',!soundOn);
    try{localStorage.setItem(SOUND_KEY,soundOn?'on':'off');}catch(error){}
    if(soundOn){initAudio();tone(520,.05,'sine',.02);}
  });
  leaderboardBtn.addEventListener('click',function(e){e.stopPropagation();openLeaderboard();});
  leaderboardClose.addEventListener('click',closeLeaderboard);
  leaderboardBackdrop.addEventListener('click',closeLeaderboard);
  allTimeTab.addEventListener('click',function(){selectLeaderboardMode('all_time');});
  weeklyTab.addEventListener('click',function(){selectLeaderboardMode('weekly');});
  loginForm.addEventListener('submit',async function(e){
    e.preventDefault();loginError.textContent='';
    var button=loginForm.querySelector('button');button.disabled=true;button.textContent='登录中…';
    try{
      await ToolboxAuth.signIn(document.getElementById('leaderboardEmail').value.trim(),document.getElementById('leaderboardPassword').value);
      document.getElementById('leaderboardPassword').value='';await refreshLeaderboard(false);
    }catch(error){loginError.textContent=ToolboxAuth.authMessage(error);}
    finally{button.disabled=false;button.textContent='登录';}
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&leaderboardLayer.classList.contains('active')){e.preventDefault();closeLeaderboard();return;}
    if(leaderboardLayer.classList.contains('active')){
      if(e.key==='Tab'){
        var items=Array.from(leaderboardLayer.querySelectorAll('button,input')).filter(function(el){return !el.disabled&&el.getClientRects().length;});
        var first=items[0],last=items[items.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
      return;
    }
    if(e.target.closest&&e.target.closest('input,textarea,button,a,[contenteditable]'))return;
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();togglePause();return;}
    if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){
      e.preventDefault();initAudio();
      if(state==='ready'||state==='over')startGame();
      else if(state==='running')flap();
    }
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='running')pauseGame();});
  window.addEventListener('resize',function(){requestAnimationFrame(resize);});
  window.addEventListener('online',function(){retryPendingSubmission();refreshLeaderboard(true);});
  ToolboxAuth.onAuthStateChange(function(){
    var next=(ToolboxAuth.peekSession()||{}).user?.id||null;
    if(next!==authUserId){
      authUserId=next;authEpoch++;activeRun=null;loadPendingBest();restorePendingRuns();
      applyLeaderboard({all_time:[],weekly:[],viewer:null});refreshLeaderboard(true).then(retryPendingSubmission);
    }
  });

  loadBest();loadPendingBest();restorePendingRuns();resetGame(true);state='ready';readyLayer.classList.remove('hidden');
  refreshLeaderboard(true).then(retryPendingSubmission);
  requestAnimationFrame(resize);raf=requestAnimationFrame(frame);
})();
</script>

</body>
