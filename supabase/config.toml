# Public leaderboard reads are intentional; start/submit authenticate in code.
[functions.flappy-game]
verify_jwt = false
entrypoint = "./functions/flappy-game/index.ts"
import_map = "./functions/flappy-game/deno.json"

[functions.stack-game]
verify_jwt = false
entrypoint = "./functions/stack-game/index.ts"
import_map = "./functions/stack-game/deno.json"

[functions.pictionary-game]
verify_jwt = true
entrypoint = "./functions/pictionary-game/index.ts"
import_map = "./functions/pictionary-game/deno.json"

# Private Blackjack uses gateway JWT validation and also checks active sessions in code.
[functions.blackjack-game]
verify_jwt = true
entrypoint = "./functions/blackjack-game/index.ts"
import_map = "./functions/blackjack-game/deno.json"

# Draft-only merge game endpoint: never permit anonymous cloud-save access.
# Deployment remains prohibited without a separate security/release approval.
[functions.merge-game]
verify_jwt = true
entrypoint = "./functions/merge-game/index.ts"

# Private story progress and independent story workshop: never anonymous.
# Draft-only until separate production deployment approval.
[functions.merge-story]
verify_jwt = true
entrypoint = "./functions/merge-story/index.ts"
