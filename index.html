<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>钊的工具箱</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:rgba(255,255,255,.78);
      --card-border:rgba(255,255,255,.72);
      --text:#182033;
      --muted:#7d879d;
      --shadow:0 14px 36px rgba(49,66,108,.12);
      --radius:24px;
      --accent:#ffb84d;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(169,208,255,.42), transparent 30%),
        radial-gradient(circle at 90% 8%, rgba(255,207,165,.32), transparent 28%),
        linear-gradient(180deg,#f8fbff 0%,#f2f5fa 100%);
      min-height:100vh;
    }
    .page{
      width:min(1120px,100%);
      margin:0 auto;
      padding:calc(24px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
    }
    .topbar{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .icon-btn{
      width:42px;height:42px;border:0;border-radius:14px;
      background:rgba(255,255,255,.72); box-shadow:var(--shadow);
      font-size:19px; cursor:pointer; backdrop-filter:blur(18px);
    }
    header{text-align:center;padding:8px 0 22px}
    .eyebrow{font-size:14px;color:#6f7890;margin-bottom:8px}
    h1{
      margin:0;
      font-size:clamp(38px,8vw,72px);
      line-height:1;
      letter-spacing:.02em;
      font-weight:900;
    }
    .underline{
      width:170px;height:8px;border-radius:999px;
      background:linear-gradient(90deg,#ffd452,#ffb24e);
      margin:8px auto 10px;
      transform:rotate(-2deg);
    }
    .subtitle{margin:0;color:#586176;font-size:15px}
    .search-wrap{
      position:relative;
      margin:4px auto 18px;
      max-width:820px;
    }
    .search{
      width:100%; border:1px solid rgba(255,255,255,.9); outline:none;
      border-radius:999px; padding:17px 22px 17px 50px;
      font-size:16px; background:rgba(255,255,255,.76);
      box-shadow:var(--shadow); backdrop-filter:blur(20px);
    }
    .search-icon{position:absolute;left:19px;top:50%;transform:translateY(-50%);font-size:20px}
    .hero{
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      min-height:130px;padding:24px;
      border-radius:28px;
      background:
        linear-gradient(120deg, rgba(213,229,255,.95), rgba(255,232,214,.9));
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:26px;
    }
    .hero h2{margin:0 0 8px;font-size:24px}
    .hero p{margin:0;color:#5f677a;line-height:1.65}
    .hero-emoji{font-size:58px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
    .section{margin-top:24px}
    .section-head{
      display:flex;align-items:center;justify-content:space-between;
      margin:0 2px 14px;
    }
    .section-head h3{margin:0;font-size:22px}
    .section-head span{color:#8a93a6;font-size:14px}
    .featured-grid,.tool-grid{
      display:grid;
      gap:14px;
    }
    .featured-grid{grid-template-columns:repeat(3,1fr)}
    .tool-grid{grid-template-columns:repeat(4,1fr)}
    .tool-card{
      position:relative;
      text-decoration:none;color:inherit;
      border-radius:var(--radius);
      padding:20px;
      min-height:180px;
      background:var(--card);
      border:1px solid var(--card-border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      transition:.18s ease;
      overflow:hidden;
    }
    .tool-card:hover{transform:translateY(-3px)}
    .tool-card:active{transform:scale(.985)}
    .tool-card.featured:nth-child(1){background:linear-gradient(145deg,#fff2ef,#ffe8e3)}
    .tool-card.featured:nth-child(2){background:linear-gradient(145deg,#eef1ff,#e7ecff)}
    .tool-card.featured:nth-child(3){background:linear-gradient(145deg,#e9fbf4,#dcf8ec)}
    .tool-icon{font-size:48px;margin-bottom:20px}
    .tool-title{font-size:20px;font-weight:800;margin-bottom:8px}
    .tool-desc{font-size:14px;line-height:1.5;color:var(--muted)}
    .arrow{
      position:absolute;right:16px;bottom:16px;
      width:34px;height:34px;border-radius:50%;
      display:grid;place-items:center;background:rgba(255,255,255,.84);
      font-size:18px;
    }
    .tool-grid .tool-card{min-height:165px}
    .empty{
      border:2px dashed rgba(121,133,160,.28);
      background:rgba(255,255,255,.34);
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      color:#9099ab;
    }
    .quote{
      margin-top:26px;
      border-radius:26px;
      padding:25px 24px;
      background:linear-gradient(120deg,rgba(245,239,255,.9),rgba(233,242,255,.88));
      box-shadow:var(--shadow);
      font-size:18px;line-height:1.8;text-align:center;
    }
    footer{
      margin-top:24px;text-align:center;color:#929aae;font-size:13px;line-height:1.8
    }
    .hidden{display:none!important}
    @media (max-width:860px){
      .featured-grid{grid-template-columns:1fr}
      .tool-grid{grid-template-columns:repeat(2,1fr)}
      .tool-card.featured{min-height:150px}
      .hero{min-height:118px}
    }
    @media (max-width:520px){
      .page{padding-left:14px;padding-right:14px}
      .tool-card{padding:17px;border-radius:21px}
      .tool-grid{gap:12px}
      .tool-grid .tool-card{min-height:155px}
      .tool-title{font-size:17px}
      .tool-icon{font-size:40px;margin-bottom:16px}
      .hero{padding:20px}
      .hero-emoji{font-size:46px}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <button class="icon-btn" id="themeBtn" aria-label="切换明暗模式">🌙</button>
    </div>

    <header>
      <div class="eyebrow">好朋友，总有好点子！</div>
      <h1>钊的工具箱</h1>
      <div class="underline"></div>
      <p class="subtitle">聚会 · 决策 · 随机 · 更有趣的日常</p>
    </header>

    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="search" class="search" type="search" placeholder="搜索工具，例如：吃什么、抽签、转盘" />
    </div>

    <section class="hero">
      <div>
        <h2>让选择变简单，让相聚更好玩</h2>
        <p>今晚吃什么、谁先来、怎么分组、随机决定……都交给它。</p>
      </div>
      <div class="hero-emoji">🍻</div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>⭐ 热门推荐</h3>
        <span>朋友聚会常用</span>
      </div>
      <div class="featured-grid" id="featuredGrid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>🧰 全部工具</h3>
        <span id="countText"></span>
      </div>
      <div class="tool-grid" id="toolGrid"></div>
    </section>

    <div class="quote">“好的饭局，不只是美食，还有一群有趣的人。”</div>

    <footer>
      工具箱 · 纯静态网页 · 适合 GitHub Pages<br/>
      后期新增功能，只需修改页面底部的 tools 配置列表
    </footer>
  </main>

  <script>
    /*
      =========================
      后期维护只需要改这里
      =========================
      title: 显示名称
      desc: 简介
      icon: Emoji 图标
      href: 对应子页面地址
      featured: 是否显示在“热门推荐”
    */
    const tools = [
      { title:"今晚吃什么", desc:"吃饭转盘 · 解决选择困难", icon:"🍜", href:"./dinner/", featured:true },
      { title:"随机抽签", desc:"公平随机 · 支持不放回抽签", icon:"🎲", href:"./draw/", featured:true },
      { title:"随机排序", desc:"一键打乱 · 快速安排顺序", icon:"🔀", href:"./shuffle/", featured:true },

      { title:"决策器", desc:"选人 · 选事 · 做决定", icon:"📋", href:"./decision/" },
      { title:"抛硬币", desc:"正面还是反面？", icon:"🪙", href:"./coin/" },
      { title:"随机数生成", desc:"指定范围 · 一键生成", icon:"#️⃣", href:"./random-number/" },
      { title:"分组工具", desc:"快速随机分组", icon:"👥", href:"./group/" },
      { title:"真心话大冒险", desc:"聚会气氛神器", icon:"🎯", href:"./truth-or-dare/" },
      { title:"待办清单", desc:"聚会 · 旅行 · 日常清单", icon:"📝", href:"./todo/" },
      { title:"喝酒小游戏", desc:"适度娱乐 · 快乐加倍", icon:"🍻", href:"./drinking-game/" }
    ];

    const featuredGrid = document.getElementById("featuredGrid");
    const toolGrid = document.getElementById("toolGrid");
    const search = document.getElementById("search");
    const countText = document.getElementById("countText");

    function cardHTML(tool, featured=false){
      return `
        <a class="tool-card ${featured ? "featured" : ""}" href="${tool.href}" data-title="${tool.title}" data-desc="${tool.desc}">
          <div class="tool-icon">${tool.icon}</div>
          <div class="tool-title">${tool.title}</div>
          <div class="tool-desc">${tool.desc}</div>
          <div class="arrow">›</div>
        </a>`;
    }

    function render(){
      featuredGrid.innerHTML = tools.filter(t => t.featured).map(t => cardHTML(t,true)).join("");
      toolGrid.innerHTML =
        tools.filter(t => !t.featured).map(t => cardHTML(t,false)).join("") +
        `<div class="tool-card empty">
          <div style="font-size:38px;margin-bottom:10px;">＋</div>
          <strong>更多工具</strong>
          <div class="tool-desc" style="margin-top:6px;text-align:center;">后期直接新增到 tools 列表</div>
        </div>`;
      countText.textContent = `共 ${tools.length} 个`;
    }

    search.addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll(".tool-card[href]").forEach(card => {
        const text = (card.dataset.title + " " + card.dataset.desc).toLowerCase();
        card.classList.toggle("hidden", q && !text.includes(q));
      });
    });

    const themeBtn = document.getElementById("themeBtn");
    let dark = false;
    themeBtn.addEventListener("click", () => {
      dark = !dark;
      themeBtn.textContent = dark ? "☀️" : "🌙";
      document.documentElement.style.setProperty("--bg", dark ? "#11151e" : "#f4f7fb");
      document.documentElement.style.setProperty("--card", dark ? "rgba(29,35,48,.82)" : "rgba(255,255,255,.78)");
      document.documentElement.style.setProperty("--card-border", dark ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.72)");
      document.documentElement.style.setProperty("--text", dark ? "#f2f5fb" : "#182033");
      document.documentElement.style.setProperty("--muted", dark ? "#aeb6c7" : "#7d879d");
      document.body.style.background = dark
        ? "radial-gradient(circle at 15% 0%, rgba(58,91,135,.35), transparent 30%), radial-gradient(circle at 90% 8%, rgba(108,74,54,.25), transparent 28%), linear-gradient(180deg,#171c26 0%,#10141c 100%)"
        : "radial-gradient(circle at 15% 0%, rgba(169,208,255,.42), transparent 30%), radial-gradient(circle at 90% 8%, rgba(255,207,165,.32), transparent 28%), linear-gradient(180deg,#f8fbff 0%,#f2f5fa 100%)";
    });

    render();
  </script>
</body>
</html>
