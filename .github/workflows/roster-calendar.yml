name: Roster calendar regression
on:
  pull_request:
    paths:
      - "admin-night-shift/index.html"
      - "tests/roster-calendar.test.mjs"
      - "tests/roster-security-alert.test.mjs"
      - ".github/workflows/roster-calendar.yml"
  push:
    branches: [main]
    paths:
      - "admin-night-shift/index.html"
      - "tests/roster-calendar.test.mjs"
      - "tests/roster-security-alert.test.mjs"
      - ".github/workflows/roster-calendar.yml"
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run calendar regression tests
        run: node --test tests/roster-calendar.test.mjs tests/roster-security-alert.test.mjs
