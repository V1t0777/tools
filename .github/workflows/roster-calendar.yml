name: Roster calendar regression
on:
  pull_request:
    paths:
      - "admin-night-shift/index.html"
      - "tests/roster-calendar.test.mjs"
      - ".github/workflows/roster-calendar.yml"
  push:
    branches: [main]
    paths:
      - "admin-night-shift/index.html"
      - "tests/roster-calendar.test.mjs"
      - ".github/workflows/roster-calendar.yml"
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run calendar regression tests
        run: node --test tests/roster-calendar.test.mjs
