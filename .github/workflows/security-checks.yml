name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    name: Security / Static scan and build isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Run repository security checks
        shell: bash
        run: bash scripts/security-check.sh

  regression-tests:
    name: Tests / Game and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Run security and game regression tests
        run: node --test tests/*.test.mjs scripts/*.test.cjs

      # Private build is attached to THIS independent regression lane; it
      # cannot bypass the existing three independent security gates.
      - name: Checkout exact private review candidate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build local-only review bundle
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        env:
          YUNYU_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/build-yunyu-private-review.sh
      - name: Upload short-lived private review archive (not deploy)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yunyu-private-review-${{ github.event.pull_request.head.sha }}
          path: dist-yunyu-private-review/
          if-no-files-found: error
          retention-days: 7

  history-secrets:
    name: Security / Full Git history secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Scan reachable Git history for secret patterns
        run: node scripts/secret-history.mjs
