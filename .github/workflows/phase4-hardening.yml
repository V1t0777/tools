name: Phase 4 hardening

on:
  push:
    paths:
      - .github/workflows/phase4-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate hardening patch
        run: python scripts/phase4_patch.py
      - name: Commit hardened frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/phase4_patch.py .github/workflows/phase4-hardening.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "security: unify toolbox auth"
          git push
