name: Phase 4 frontend hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch protected pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ANALYTICS = 'bfd3df5c469343eb91856b7f3275def8'
          SHARED = '<script src="../shared/toolbox-auth.js?v=20260917-4"></script>'

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old, new, 1)

          # Night shift: replace floating third-party SDK with the local unified auth client.
          p = Path('night-shift/index.html')
          s = p.read_text()
          s = must_replace(s, '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', SHARED, 'night sdk')
          s = must_replace(s,
              '  const SUPABASE_URL = "https://tmxpueakxibsaakdyusn.supabase.co";\n  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8sCgnOXk3XuRE28Qmk_ekg_9VSS4ASZ";\n\n  const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);',
              '  const db = ToolboxAuth.createClient();', 'night client')
          s = must_replace(s, 'if(error) throw new Error("邮箱或密码错误，或该账号未获授权。");', 'if(error) throw error;', 'night login error')
          s = must_replace(s, '}catch(err){ showError($("loginError"),err.message); }', '}catch(err){ showError($("loginError"),ToolboxAuth.authMessage(err)); }', 'night login message')
          if ANALYTICS not in s or 'cdn.jsdelivr.net/npm/@supabase' in s:
              raise SystemExit('night-shift verification failed')
          p.write_text(s)

          # Department roster: same unified auth/session layer, leaving business UI untouched.
          p = Path('admin-night-shift/index.html')
          s = p.read_text()
          s = must_replace(s, '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', SHARED, 'roster sdk')
          s = must_replace(s,
              '  const SUPABASE_URL = "https://tmxpueakxibsaakdyusn.supabase.co";\n  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8sCgnOXk3XuRE28Qmk_ekg_9VSS4ASZ";\n  const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);',
              '  const db = ToolboxAuth.createClient();', 'roster client')
          s = must_replace(s, 'if (error) throw new Error("邮箱或密码错误，或账号未获授权。");', 'if (error) throw error;', 'roster login error')
          s = must_replace(s, '$("loginError").textContent = err.message || "登录失败。";', '$("loginError").textContent = ToolboxAuth.authMessage(err);', 'roster login message')
          if ANALYTICS not in s or 'cdn.jsdelivr.net/npm/@supabase' in s:
              raise SystemExit('admin-night-shift verification failed')
          p.write_text(s)

          # Dinner page: load shared auth before the application script.
          p = Path('dinner/index.html')
          s = p.read_text()
          m = re.search(r'<script src="\./app\.js\?v=[^"]+" defer></script>', s)
          if not m:
              raise SystemExit('missing dinner app script')
          s = s[:m.start()] + '<script src="../shared/toolbox-auth.js?v=20260917-4" defer></script>\n<script src="./app.js?v=20260917-4" defer></script>' + s[m.end():]
          if ANALYTICS not in s:
              raise SystemExit('dinner analytics missing')
          p.write_text(s)

          # Dinner app: remove its separate token store/refresh implementation and use unified auth.
          p = Path('dinner/app.js')
          s = p.read_text()
          s = re.sub(r"^const URL=.*?AUTH_STORE='dinnerSupabaseAuth\.v1';", "const LOCAL='dinnerDecision.v3';", s, count=1)
          s = s.replace('const uid=()=>crypto?.randomUUID?.()', 'const uid=()=>globalThis.crypto?.randomUUID?.()', 1)
          s, n = re.subn(
              r"function saveAuth\(\).*?const q=v=>encodeURIComponent\(v\);",
              "async function rest(path,opts={}){try{return await ToolboxAuth.rest(path,opts)}catch(e){if(e?.code==='SESSION_REVOKED'||e?.code==='AUTH_REQUIRED'){session=null;cloud=false;stopSync();renderSync()}throw e}}\nconst q=v=>encodeURIComponent(v);",
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dinner auth transport patch failed')
          s, n = re.subn(
              r"async function login\(\).*?(?=async function logout\(\))",
              "async function login(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password)return toast('请输入邮箱和密码');$('loginBtn').disabled=true;try{const data=await ToolboxAuth.signIn(email,password);session=data;if(await activate(data)){close('accountOverlay');$('loginPassword').value='';toast('多人同步已开启')}}catch(e){session=null;toast(ToolboxAuth.authMessage(e),2600)}finally{$('loginBtn').disabled=false}}\n",
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dinner login patch failed')
          s, n = re.subn(
              r"async function logout\(\).*?(?=function account\(\))",
              "async function logout(){stopSync();await ToolboxAuth.signOut();session=null;cloud=false;groupId=null;groupName='';myName='';members=[];loadLocal();renderAll();renderSync();close('accountOverlay');toast('已回到单机模式')}\n",
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dinner logout patch failed')
          old_restore = "(async()=>{session=readAuth();if(!session)return;try{if(await ensureAuth())await activate(session);else{session=null;saveAuth()}}catch(e){console.warn('restore session failed',e);session=null;saveAuth();cloud=false;renderSync()}})();"
          new_restore = "ToolboxAuth.createClient().auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&cloud){stopSync();session=null;cloud=false;groupId=null;groupName='';myName='';members=[];loadLocal();renderAll();renderSync();toast('登录状态已失效，请重新登录',2200)}});\n(async()=>{try{session=await ToolboxAuth.getSession();if(session)await activate(session)}catch(e){console.warn('restore session failed',e);session=null;cloud=false;renderSync()}})();"
          s = must_replace(s, old_restore, new_restore, 'dinner restore')
          if any(x in s for x in ['AUTH_STORE', 'authRequest(', 'refreshAuth(', 'ensureAuth(']):
              raise SystemExit('legacy dinner auth code remains')
          if 'd.innerHTML=' in s:
              raise SystemExit('unsafe dinner finalist rendering detected')
          p.write_text(s)
          PY

      - name: Syntax and security checks
        shell: bash
        run: |
          node --check shared/toolbox-auth.js
          node --check dinner/app.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for f in ['night-shift/index.html','admin-night-shift/index.html']:
              s=Path(f).read_text()
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)
              code=max(blocks,key=len)
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as x:
                  x.write(code); name=x.name
              subprocess.run(['node','--check',name],check=True)
              assert '../shared/toolbox-auth.js?v=20260917-4' in s
              assert 'cdn.jsdelivr.net/npm/@supabase' not in s
              assert 'bfd3df5c469343eb91856b7f3275def8' in s
          d=Path('dinner/index.html').read_text()
          assert '../shared/toolbox-auth.js?v=20260917-4' in d
          assert 'bfd3df5c469343eb91856b7f3275def8' in d
          PY

      - name: Commit hardened frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-hardening.yml
          git add shared/toolbox-auth.js night-shift/index.html admin-night-shift/index.html dinner/index.html dinner/app.js
          git commit -m "security: unify protected-page authentication"
          git push origin HEAD:main
