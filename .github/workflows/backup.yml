name: Verified repository backup

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-backup
  cancel-in-progress: false

jobs:
  git-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git bundle create backup/tools.bundle --all
          git bundle verify backup/tools.bundle
          sha256sum backup/tools.bundle > backup/tools.bundle.sha256

      - name: Store backup for 90 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tools-git-bundle-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
