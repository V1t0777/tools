<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f4f7" />
  <title>抛硬币｜工具箱</title>
  <link rel="stylesheet" href="../shared/toolbox-ui.css" />
  <link rel="stylesheet" href="../shared/toolbox-motion.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f3f4f7;
      --card: rgba(255, 255, 255, .86);
      --text: #17191f;
      --sub: #737986;
      --line: rgba(31, 36, 47, .08);
      --shadow: 0 22px 58px rgba(41, 47, 61, .12);
      --brass-light: #e5cb8b;
      --brass-mid: #c69b48;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 37%, rgba(193, 151, 72, .09), transparent 26%),
        radial-gradient(circle at 14% 7%, rgba(255, 255, 255, .92), transparent 29%),
        radial-gradient(circle at 90% 83%, rgba(133, 158, 201, .13), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      overscroll-behavior: none;
    }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    }
    button, a { -webkit-touch-callout: none; }
    .app {
      width: min(100%, 520px);
      min-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .topbar { display: flex; align-items: center; min-height: 44px; }
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, .66);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 8px 20px rgba(50, 56, 70, .07);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .title-wrap h1 {
      margin: 8px 0 4px;
      font-size: clamp(30px, 8vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    .title-wrap p { margin: 0; color: var(--sub); font-size: 15px; }
    .card {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .94);
      border-radius: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 20px 24px;
      overflow: hidden;
      isolation: isolate;
    }
    .card::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      top: 70px;
      left: 50%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(193, 148, 61, .085), transparent 68%);
      transform: translateX(-50%);
      transition: opacity .24s ease, transform .5s ease;
      pointer-events: none;
    }
    .card.is-flipping::before { opacity: .72; transform: translateX(-50%) scale(1.12); }
    .coin-stage {
      position: relative;
      width: 100%;
      min-height: 300px;
      display: grid;
      place-items: center;
      perspective: 920px;
      touch-action: manipulation;
      user-select: none;
      cursor: pointer;
      outline: none;
    }
    .coin-stage:focus-visible { border-radius: 24px; box-shadow: 0 0 0 3px rgba(139, 111, 57, .16); }
    .coin-rig {
      position: relative;
      width: min(47vw, 184px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .coin-shadow {
      position: absolute;
      left: 50%;
      bottom: 36px;
      width: min(35vw, 132px);
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(53, 42, 24, .31) 0%, rgba(53, 42, 24, .13) 44%, transparent 72%);
      transform: translateX(-50%) scaleX(.92);
      filter: blur(5px);
      opacity: .68;
      will-change: transform, opacity, filter;
      pointer-events: none;
    }
    .edge-layer, .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transform-style: preserve-3d;
    }
    .edge-layer {
      background: repeating-conic-gradient(from 2deg, #6e4d1d 0deg 2.2deg, #c49a4d 2.2deg 4.5deg, #876226 4.5deg 6.6deg);
      box-shadow: inset 0 0 12px rgba(66, 42, 8, .38);
    }
    .face {
      display: grid;
      place-items: center;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 2px solid rgba(105, 75, 27, .68);
      background:
        radial-gradient(circle at 31% 24%, rgba(255, 246, 204, .72) 0 6%, transparent 23%),
        radial-gradient(circle at 68% 76%, rgba(104, 67, 17, .28), transparent 40%),
        repeating-linear-gradient(112deg, rgba(255, 255, 255, .035) 0 1px, rgba(88, 58, 13, .028) 1px 3px),
        linear-gradient(142deg, var(--brass-light) 0%, #d5ae5e 36%, var(--brass-mid) 63%, #9a702c 100%);
      box-shadow:
        inset 0 0 0 5px rgba(255, 239, 187, .26),
        inset 0 0 0 8px rgba(100, 66, 17, .20),
        inset 12px 14px 24px rgba(255, 237, 175, .12),
        inset -15px -17px 28px rgba(91, 57, 9, .28),
        0 1px 0 rgba(255, 245, 209, .65);
    }
    .face.front { transform: translateZ(6px); }
    .face.back { transform: rotateY(180deg) translateZ(6px); }
    .face::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      border: 1px solid rgba(105, 73, 22, .46);
      box-shadow: inset 0 1px 0 rgba(255, 242, 194, .46), 0 1px 0 rgba(255, 242, 194, .26);
    }
    .face::after {
      content: "";
      position: absolute;
      inset: -28%;
      border-radius: 44%;
      background: linear-gradient(108deg, transparent 35%, rgba(255, 249, 220, .42) 48%, rgba(255, 255, 255, .08) 54%, transparent 64%);
      transform: translateX(-72%) rotate(7deg);
      opacity: .66;
      pointer-events: none;
    }
    .coin.flipping .face::after { animation: metal-sweep 720ms cubic-bezier(.3, .7, .2, 1) 120ms 2; }
    .face-mark {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 60%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(100, 68, 18, .26);
      background: radial-gradient(circle at 38% 31%, rgba(255, 240, 183, .21), rgba(111, 73, 18, .08) 78%);
      box-shadow: inset 2px 3px 7px rgba(255, 239, 184, .20), inset -3px -4px 8px rgba(90, 57, 11, .16);
      color: #76501b;
      font-size: clamp(42px, 12vw, 68px);
      font-weight: 850;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 240, 190, .68), 0 -1px 0 rgba(84, 51, 8, .24);
    }
    @keyframes metal-sweep {
      0% { transform: translateX(-72%) rotate(7deg); opacity: 0; }
      30% { opacity: .62; }
      72%, 100% { transform: translateX(72%) rotate(7deg); opacity: 0; }
    }
    .result {
      min-height: 54px;
      margin-top: 0;
      text-align: center;
      transition: opacity .2s ease;
    }
    .card.is-flipping .result { opacity: .66; }
    .result.reveal { animation: result-reveal .22s cubic-bezier(.2, .75, .25, 1) both; }
    .result strong { display: block; font-size: 30px; letter-spacing: -.03em; }
    .result span { display: block; margin-top: 6px; color: var(--sub); font-size: 14px; }
    @keyframes result-reveal {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .primary {
      width: 100%;
      min-height: 58px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 18px;
      margin-top: 18px;
      background: linear-gradient(180deg, #24262c, #17191f);
      color: white;
      font-size: 18px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 10px 22px rgba(20, 20, 25, .18), inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: transform .12s ease, opacity .18s ease, filter .18s ease;
    }
    .primary:active { transform: scale(.985); }
    .primary:disabled { opacity: .58; filter: saturate(.8); cursor: default; }
    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
      transition: opacity .22s ease;
    }
    .card.is-flipping .stats { opacity: .76; }
    .stat {
      min-width: 0;
      padding: 13px 8px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(247, 248, 251, .82);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .78);
    }
    .stat b { display: block; font-size: 20px; }
    .stat small { display: block; margin-top: 3px; color: var(--sub); font-size: 12px; }
    .reset {
      margin-top: 14px;
      border: 0;
      background: transparent;
      color: #7a7f89;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .hint { text-align: center; color: var(--sub); font-size: 12px; padding-bottom: 2px; }
    @media (max-height: 720px) {
      .coin-stage { min-height: 230px; }
      .coin-rig { width: min(39vw, 152px); }
      .coin-shadow { bottom: 22px; }
      .card { padding-top: 18px; }
      .title-wrap h1 { font-size: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .coin.flipping .face::after { animation: none; }
      .card::before, .result, .stats, .primary { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar"><a class="back" href="../" aria-label="返回工具箱">← 工具箱</a></div>
    <section class="title-wrap"><h1>抛硬币</h1><p>正面还是反面？交给概率。</p></section>
    <section class="card" id="coinCard">
      <div class="coin-stage" id="coinStage" role="button" tabindex="0" aria-label="点击抛硬币">
        <div class="coin-shadow" id="coinShadow" aria-hidden="true"></div>
        <div class="coin-rig" id="coinRig">
          <div class="coin" id="coin">
            <div class="edge-layer" style="transform:translateZ(-5px)"></div>
            <div class="edge-layer" style="transform:translateZ(-4px)"></div>
            <div class="edge-layer" style="transform:translateZ(-3px)"></div>
            <div class="edge-layer" style="transform:translateZ(-2px)"></div>
            <div class="edge-layer" style="transform:translateZ(-1px)"></div>
            <div class="edge-layer" style="transform:translateZ(0)"></div>
            <div class="edge-layer" style="transform:translateZ(1px)"></div>
            <div class="edge-layer" style="transform:translateZ(2px)"></div>
            <div class="edge-layer" style="transform:translateZ(3px)"></div>
            <div class="edge-layer" style="transform:translateZ(4px)"></div>
            <div class="edge-layer" style="transform:translateZ(5px)"></div>
            <div class="face front"><span class="face-mark">正</span></div>
            <div class="face back"><span class="face-mark">反</span></div>
          </div>
        </div>
      </div>
      <div class="result" id="result" aria-live="polite">
        <strong id="resultText">准备好了</strong>
        <span id="resultSub">点击硬币或下方按钮开始</span>
      </div>
      <button class="primary" id="flipBtn">抛一次</button>
      <div class="stats">
        <div class="stat"><b id="totalCount">0</b><small>总次数</small></div>
        <div class="stat"><b id="headsCount">0</b><small>正面</small></div>
        <div class="stat"><b id="tailsCount">0</b><small>反面</small></div>
      </div>
      <button class="reset" id="resetBtn">重置统计</button>
    </section>
    <div class="hint">每次抛掷正反面概率均为 50%</div>
  </main>
  <script>
    const coin = document.getElementById('coin');
    const coinRig = document.getElementById('coinRig');
    const coinShadow = document.getElementById('coinShadow');
    const coinCard = document.getElementById('coinCard');
    const coinStage = document.getElementById('coinStage');
    const flipBtn = document.getElementById('flipBtn');
    const resetBtn = document.getElementById('resetBtn');
    const result = document.getElementById('result');
    const resultText = document.getElementById('resultText');
    const resultSub = document.getElementById('resultSub');
    const totalCount = document.getElementById('totalCount');
    const headsCount = document.getElementById('headsCount');
    const tailsCount = document.getElementById('tailsCount');
    let total = 0;
    let heads = 0;
    let tails = 0;
    let currentRotation = 0;
    let busy = false;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function secureBit() {
      if (window.crypto?.getRandomValues) {
        const value = new Uint32Array(1);
        window.crypto.getRandomValues(value);
        return value[0] & 1;
      }
      return Math.random() < .5 ? 0 : 1;
    }
    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function updateStats() {
      totalCount.textContent = total;
      headsCount.textContent = heads;
      tailsCount.textContent = tails;
    }
    function revealResult(isHeads) {
      resultText.textContent = isHeads ? '正面' : '反面';
      resultSub.textContent = isHeads ? '这次是正面朝上' : '这次是反面朝上';
      result.classList.remove('reveal');
      void result.offsetWidth;
      result.classList.add('reveal');
    }

    async function flipCoin() {
      if (busy) return;
      busy = true;
      flipBtn.disabled = true;
      coinCard.classList.add('is-flipping');
      const isHeads = secureBit() === 0;
      const previousRotation = currentRotation;
      const endFace = isHeads ? 0 : 180;
      const spinTurns = 6 + Math.floor(Math.random() * 2);
      const correction = (endFace - (previousRotation % 360) + 360) % 360;
      const targetRotation = previousRotation + spinTurns * 360 + correction;
      resultText.textContent = '抛掷中…';
      resultSub.textContent = '硬币正在空中翻转';
      coin.classList.add('flipping');
      if (navigator.vibrate) navigator.vibrate(5);

      if (reduceMotion.matches) {
        const reducedFlip = coin.animate([
          { transform: `rotateY(${previousRotation}deg)` },
          { transform: `rotateY(${targetRotation}deg)` }
        ], { duration: 340, easing: 'cubic-bezier(.2,.72,.25,1)', fill: 'forwards' });
        await reducedFlip.finished;
        coin.style.transform = `rotateY(${targetRotation}deg)`;
        reducedFlip.cancel();
      } else {
        const duration = Math.round(randomBetween(1500, 1630));
        const height = Math.round(randomBetween(146, 158));
        const drift = randomBetween(-5, 5).toFixed(1);
        const tilt = randomBetween(-10, 10).toFixed(1);
        const xTurns = 2 + Math.floor(Math.random() * 2);
        const flight = coinRig.animate([
          { transform: 'translate3d(0,0,0) scale(1)', offset: 0, easing: 'cubic-bezier(.28,.02,.58,.25)' },
          { transform: `translate3d(${drift}px,-${height}px,0) scale(.985)`, offset: .42, easing: 'cubic-bezier(.28,.62,.32,1)' },
          { transform: `translate3d(${drift}px,-${height - 4}px,0) scale(.985)`, offset: .50, easing: 'cubic-bezier(.55,.05,.78,.42)' },
          { transform: 'translate3d(0,0,0) scale(1)', offset: .80, easing: 'cubic-bezier(.16,.74,.3,1)' },
          { transform: 'translate3d(0,0,0) scale3d(1.01,.975,1)', offset: .825, easing: 'cubic-bezier(.2,.7,.3,1)' },
          { transform: 'translate3d(0,-7px,0) scale(1)', offset: .87, easing: 'cubic-bezier(.36,.02,.68,.34)' },
          { transform: 'translate3d(0,0,0)', offset: .925, easing: 'cubic-bezier(.2,.72,.25,1)' },
          { transform: 'translate3d(0,-2px,0)', offset: .962, easing: 'ease-in' },
          { transform: 'translate3d(0,0,0)', offset: 1 }
        ], { duration, fill: 'forwards' });
        const rotation = coin.animate([
          { transform: `rotateX(0deg) rotateY(${previousRotation}deg) rotateZ(0deg)`, offset: 0 },
          { transform: `rotateX(${xTurns * 122}deg) rotateY(${previousRotation + (targetRotation - previousRotation) * .34}deg) rotateZ(${tilt}deg)`, offset: .28 },
          { transform: `rotateX(${xTurns * 238}deg) rotateY(${previousRotation + (targetRotation - previousRotation) * .68}deg) rotateZ(${-tilt * .45}deg)`, offset: .58 },
          { transform: `rotateX(${xTurns * 330}deg) rotateY(${previousRotation + (targetRotation - previousRotation) * .91}deg) rotateZ(${tilt * .16}deg)`, offset: .76 },
          { transform: `rotateX(${xTurns * 360}deg) rotateY(${targetRotation}deg) rotateZ(0deg)`, offset: .91 },
          { transform: `rotateX(${xTurns * 360}deg) rotateY(${targetRotation}deg) rotateZ(-1.4deg)`, offset: .95 },
          { transform: `rotateX(${xTurns * 360}deg) rotateY(${targetRotation}deg) rotateZ(.55deg)`, offset: .978 },
          { transform: `rotateX(${xTurns * 360}deg) rotateY(${targetRotation}deg) rotateZ(0deg)`, offset: 1 }
        ], { duration, easing: 'linear', fill: 'forwards' });
        const shadow = coinShadow.animate([
          { transform: 'translateX(-50%) scaleX(.92)', opacity: .68, filter: 'blur(5px)', offset: 0 },
          { transform: 'translateX(-50%) scaleX(.50)', opacity: .20, filter: 'blur(11px)', offset: .46 },
          { transform: 'translateX(-50%) scaleX(1.03)', opacity: .75, filter: 'blur(4px)', offset: .80 },
          { transform: 'translateX(-50%) scaleX(1.06)', opacity: .79, filter: 'blur(3.8px)', offset: .825 },
          { transform: 'translateX(-50%) scaleX(.87)', opacity: .53, filter: 'blur(5.5px)', offset: .87 },
          { transform: 'translateX(-50%) scaleX(.92)', opacity: .68, filter: 'blur(5px)', offset: 1 }
        ], { duration, easing: 'linear', fill: 'forwards' });
        await Promise.all([flight.finished, rotation.finished, shadow.finished]);
        flight.cancel();
        rotation.cancel();
        shadow.cancel();
        coin.style.transform = `rotateY(${targetRotation}deg)`;
      }
      currentRotation = targetRotation;
      total++;
      if (isHeads) heads++;
      else tails++;
      updateStats();
      if (navigator.vibrate) navigator.vibrate(12);
      // 等硬币完全稳定后再揭晓结果，避免文字抢在物理动画之前出现。
      await new Promise(resolve => setTimeout(resolve, reduceMotion.matches ? 20 : 90));
      revealResult(isHeads);
      coin.classList.remove('flipping');
      coinCard.classList.remove('is-flipping');
      busy = false;
      flipBtn.disabled = false;
    }
    flipBtn.addEventListener('click', flipCoin);
    coinStage.addEventListener('click', flipCoin);
    coinStage.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        flipCoin();
      }
    });
    resetBtn.addEventListener('click', () => {
      if (busy) return;
      total = heads = tails = 0;
      updateStats();
      resultText.textContent = '已重置';
      resultSub.textContent = '点击硬币继续';
    });
  </script>
