<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#10131d">
  <title>夜班日历｜钊的工具箱</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#10131d;--card:rgba(255,255,255,.065);--border:rgba(255,255,255,.10);
      --text:#f5f7fb;--muted:#9da6b8;--accent:#d8c9ff;--danger:#ff929d;
      --holiday:#ff9b9f;--workday:#9abaff;--shadow:0 20px 50px rgba(0,0,0,.27)
    }
    html,body{margin:0;min-height:100%}
    body{
      min-height:100dvh;color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 18% 0%,rgba(105,88,190,.28),transparent 31%),
        radial-gradient(circle at 90% 15%,rgba(66,121,190,.20),transparent 29%),
        linear-gradient(180deg,#171a27 0%,#0d1018 100%);
      padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))
    }
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}.page{width:min(100%,720px);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
    .back,.logout-btn{
      min-height:42px;padding:0 14px;border:1px solid var(--border);border-radius:15px;
      background:rgba(255,255,255,.06);color:var(--text);text-decoration:none;
      display:inline-flex;align-items:center;font-size:14px;font-weight:700
    }
    .user-area{display:flex;align-items:center;gap:9px}.user-name{font-size:13px;color:#d9dce5}
    .login-page{min-height:calc(100dvh - 60px);display:grid;place-items:center}
    .login-card,.calendar-card,.next-card{
      border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(20px)
    }
    .login-card{width:100%;padding:30px 20px;border-radius:30px;text-align:center}
    .moon{font-size:54px}.login-card h1{margin:6px 0 0;font-size:36px;letter-spacing:-.04em}
    .subtitle{color:var(--muted);font-size:14px;line-height:1.7;margin:10px 0 25px}
    .form-group{text-align:left;margin-bottom:14px}.form-group label{display:block;margin:0 2px 7px;font-size:13px;font-weight:700;color:#d0d4df}
    .input{
      width:100%;min-height:54px;border:1px solid var(--border);border-radius:16px;
      background:rgba(255,255,255,.06);color:var(--text);outline:none;padding:0 15px;font-size:16px
    }
    textarea.input{min-height:90px;padding-top:14px;resize:vertical}
    .input:focus{border-color:rgba(193,179,255,.65);box-shadow:0 0 0 3px rgba(172,155,255,.10)}
    .primary-btn,.fab{
      width:100%;min-height:56px;border:0;border-radius:18px;
      background:linear-gradient(135deg,#ddd1ff,#a7c5ff);color:#171824;font-weight:900
    }
    .primary-btn:disabled{opacity:.55}.login-error,.sheet-error{min-height:20px;margin-top:11px;color:#ff9aa6;font-size:12px}
    .privacy-note{margin-top:20px;padding-top:17px;border-top:1px solid var(--border);font-size:11px;line-height:1.7;color:#8791a5}
    header{padding:8px 3px 18px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#aaa3d7;font-weight:800}
    header h1{margin:7px 0 5px;font-size:clamp(34px,9vw,52px);letter-spacing:-.045em;line-height:1}
    header p{margin:0;color:var(--muted);font-size:14px}
    .next-card{
      position:relative;overflow:hidden;padding:22px 19px;border-radius:28px;
      background:linear-gradient(135deg,rgba(166,144,255,.13),rgba(90,149,255,.08)),rgba(255,255,255,.05)
    }
    .next-label{color:#c8baff;font-size:12px;font-weight:800}.next-date{margin-top:7px;font-size:25px;font-weight:900}
    .next-type{margin-top:4px;color:#bbc2d3;font-size:13px}.next-holiday{margin-top:8px;font-size:12px;font-weight:800}
    .next-holiday.holiday{color:var(--holiday)}.next-holiday.workday{color:var(--workday)}
    .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
    .count-unit{padding:12px 4px;border:1px solid var(--border);border-radius:16px;text-align:center;background:rgba(255,255,255,.05)}
    .count-unit b{display:block;font-size:clamp(20px,6vw,30px);font-variant-numeric:tabular-nums}.count-unit span{font-size:10px;color:var(--muted)}
    .calendar-card{margin-top:16px;padding:17px 10px;border-radius:27px}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 15px}
    .calendar-title{font-size:20px;font-weight:850}.month-btn{width:42px;height:42px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.055);color:var(--text);font-size:22px}
    .weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{padding:7px 0 10px;text-align:center;color:#7f899d;font-size:11px}
    .day{position:relative;min-height:82px;margin:2px;padding:6px 4px;border:1px solid transparent;border-radius:14px;overflow:hidden}
    .day.has-shift{background:rgba(255,255,255,.04)}.day.today{border-color:rgba(202,188,255,.45)}.day.other-month{opacity:.22}
    .day.legal-holiday{background:rgba(255,95,112,.055)}.day.makeup-workday{background:rgba(128,165,255,.055)}
    .day-number{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:750}
    .today .day-number{background:#e0d6ff;color:#171822}
    .holiday-badge{
      position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;
      border-radius:6px;font-size:9px;font-weight:900
    }
    .holiday-badge.holiday{background:rgba(255,95,112,.18);color:var(--holiday)}
    .holiday-badge.workday{background:rgba(128,165,255,.18);color:var(--workday)}
    .holiday-name{margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:8px;font-weight:700;color:var(--holiday)}
    .makeup-workday .holiday-name{color:var(--workday)}
    .shift-chip{display:flex;align-items:center;gap:4px;margin-top:4px;overflow:hidden;font-size:9px;white-space:nowrap}
    .shift-dot{width:6px;height:6px;flex:0 0 auto;border-radius:50%}.shift-chip-text{overflow:hidden;text-overflow:ellipsis}
    .calendar-legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:13px 5px 0;color:var(--muted);font-size:11px;border-top:1px solid rgba(255,255,255,.06);margin-top:10px}
    .legend-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;font-size:9px;font-weight:900;margin-right:5px}
    .legend-badge.holiday{background:rgba(255,95,112,.18);color:var(--holiday)}.legend-badge.workday{background:rgba(128,165,255,.18);color:var(--workday)}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:23px 3px 11px}.section-title h2{margin:0;font-size:18px}.section-title span{font-size:11px;color:var(--muted)}
    .shift-list{display:grid;gap:10px}.shift-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px;border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,.05)}
    .shift-item.holiday-shift{border-color:rgba(255,140,145,.22);background:linear-gradient(120deg,rgba(255,105,110,.055),rgba(255,255,255,.045))}
    .shift-left{min-width:0}.shift-person{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800}.person-dot{width:9px;height:9px;border-radius:50%}
    .shift-meta,.shift-note,.shift-holiday{margin-top:5px;font-size:12px}.shift-meta{color:var(--muted)}.shift-note{color:#d0d3dd;line-height:1.5}.shift-holiday{font-weight:800}.shift-holiday.holiday{color:var(--holiday)}.shift-holiday.workday{color:var(--workday)}
    .actions{display:flex;gap:6px}.small-btn{min-height:37px;padding:0 10px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.055);color:var(--text);font-size:11px}.small-btn.danger{color:var(--danger)}
    .empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:20px;font-size:13px}
    .fab-wrap{position:sticky;bottom:max(16px,env(safe-area-inset-bottom));margin-top:20px;pointer-events:none}.fab{pointer-events:auto;box-shadow:0 14px 32px rgba(104,123,208,.26)}
    .overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;background:rgba(5,7,12,.68);backdrop-filter:blur(6px)}
    .sheet{width:min(100%,720px);max-height:92dvh;margin:auto auto 0;overflow:auto;padding:15px 16px max(20px,env(safe-area-inset-bottom));border:1px solid var(--border);border-radius:28px 28px 0 0;background:#191d29}
    .sheet-handle{width:42px;height:5px;margin:0 auto 16px;border-radius:999px;background:rgba(255,255,255,.18)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet-head h2{margin:0;font-size:21px}
    .close-btn{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:21px}
    .warning{margin:12px 0 2px;padding:12px 13px;border:1px solid rgba(255,202,142,.10);border-radius:14px;background:rgba(255,185,104,.055);color:#cfbfad;font-size:11px;line-height:1.6}
    .secondary-btn{width:100%;min-height:50px;margin-top:8px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.055);color:var(--text);font-weight:750}
    @media(max-width:420px){.day{min-height:76px;margin:1px;padding:6px 3px}.shift-chip{font-size:8px}.holiday-name{font-size:7px}}
  </style>
</head>
<body>
<main class="page">
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="moon">🌙</div>
      <h1>夜班日历</h1>
      <p class="subtitle">仅限已授权成员访问<br>登录后查看共享排班</p>
      <form id="loginForm">
        <div class="form-group"><label for="email">邮箱</label><input id="email" class="input" type="email" autocomplete="email" required placeholder="请输入邮箱"></div>
        <div class="form-group"><label for="password">密码</label><input id="password" class="input" type="password" autocomplete="current-password" required placeholder="请输入密码"></div>
        <button id="loginBtn" class="primary-btn" type="submit">登录</button>
      </form>
      <div id="loginError" class="login-error" aria-live="polite"></div>
      <div class="privacy-note">本页面不提供公开注册。请勿在夜班备注中填写患者信息、病历内容或其他敏感个人/医疗信息。</div>
    </div>
  </section>

  <section id="appPage" class="hidden">
    <div class="topbar">
      <a class="back" href="../">← 工具箱</a>
      <div class="user-area"><span id="currentUserName" class="user-name"></span><button id="logoutBtn" class="logout-btn">退出</button></div>
    </div>

    <header>
      <div class="eyebrow">NIGHT SHIFT</div>
      <h1>🌙 夜班日历</h1>
      <p>共享排班 · 节假日 · 调休一目了然</p>
    </header>

    <section class="next-card">
      <div class="next-label">下一次我的夜班</div>
      <div id="nextShiftDate" class="next-date">正在加载…</div>
      <div id="nextShiftType" class="next-type"></div>
      <div id="nextHoliday" class="next-holiday"></div>
      <div class="countdown">
        <div class="count-unit"><b id="cdDays">--</b><span>天</span></div>
        <div class="count-unit"><b id="cdHours">--</b><span>小时</span></div>
        <div class="count-unit"><b id="cdMinutes">--</b><span>分钟</span></div>
        <div class="count-unit"><b id="cdSeconds">--</b><span>秒</span></div>
      </div>
    </section>

    <section class="calendar-card">
      <div class="calendar-head">
        <button id="prevMonth" class="month-btn">‹</button>
        <div id="calendarTitle" class="calendar-title"></div>
        <button id="nextMonth" class="month-btn">›</button>
      </div>
      <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="calendar-legend">
        <span><b class="legend-badge holiday">休</b>法定/调休休息</span>
        <span><b class="legend-badge workday">班</b>调休工作日</span>
      </div>
    </section>

    <div class="section-title"><h2>本月排班</h2><span id="shiftCount"></span></div>
    <section id="shiftList" class="shift-list"></section>

    <div class="fab-wrap"><button id="addShiftBtn" class="fab">＋ 添加我的夜班</button></div>
  </section>
</main>

<div id="sheetOverlay" class="overlay hidden">
  <section class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="sheetTitle">添加我的夜班</h2><button id="closeSheet" class="close-btn">×</button></div>
    <form id="shiftForm">
      <input id="editingId" type="hidden">
      <div class="form-group"><label for="shiftDate">日期</label><input id="shiftDate" class="input" type="date" required></div>
      <div class="form-group">
        <label for="shiftType">班次</label>
        <select id="shiftType" class="input" required>
          <option value="夜班">夜班</option><option value="小夜">小夜</option><option value="大夜">大夜</option><option value="二线">二线</option><option value="备班">备班</option>
        </select>
      </div>
      <div class="form-group"><label for="shiftNote">备注（选填）</label><textarea id="shiftNote" class="input" maxlength="100" placeholder="例如：换班、备班等"></textarea></div>
      <div class="warning">⚠️ 请勿填写患者姓名、住院号、诊断、联系方式、病历内容或其他医疗/个人敏感信息。</div>
      <button id="saveShiftBtn" class="primary-btn" type="submit">保存</button>
      <button id="cancelShiftBtn" class="secondary-btn" type="button">取消</button>
      <div id="sheetError" class="sheet-error"></div>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://tmxpueakxibsaakdyusn.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8sCgnOXk3XuRE28Qmk_ekg_9VSS4ASZ";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let myMemberId=null,myMember=null,members=[],shifts=[],calendarDate=new Date(),nextShift=null,countdownTimer=null;
  const holidayCache = new Map();

  const $ = id => document.getElementById(id);
  const pad2 = n => String(n).padStart(2,"0");
  const toYMD = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const parseLocalDate = ymd => { const [y,m,d]=ymd.split("-").map(Number); return new Date(y,m-1,d,0,0,0,0); };
  const formatChineseDate = ymd => new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric",weekday:"short"}).format(parseLocalDate(ymd));
  const memberById = id => members.find(m=>m.id===id);
  const showError = (el,msg) => el.textContent = msg || "";

  async function loadHolidayYear(year){
    if(holidayCache.has(year)) return holidayCache.get(year);
    try{
      const r = await fetch(`../holidays/${year}.json`,{cache:"no-cache"});
      if(!r.ok) throw new Error("no holiday file");
      const data = await r.json();
      const days = data.days || {};
      holidayCache.set(year,days);
      return days;
    }catch{
      holidayCache.set(year,{});
      return {};
    }
  }

  async function holidayForDate(ymd){
    const year = Number(ymd.slice(0,4));
    const days = await loadHolidayYear(year);
    return days[ymd] || null;
  }

  $("loginForm").addEventListener("submit",async e=>{
    e.preventDefault(); showError($("loginError"),""); $("loginBtn").disabled=true; $("loginBtn").textContent="正在登录…";
    try{
      const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
      if(error) throw new Error("邮箱或密码错误，或该账号未获授权。");
      await enterApp();
    }catch(err){ showError($("loginError"),err.message); }
    finally{$("loginBtn").disabled=false;$("loginBtn").textContent="登录";}
  });

  async function init(){
    const {data:{session}}=await db.auth.getSession();
    if(session){ try{await enterApp();}catch{await db.auth.signOut();showLogin();showError($("loginError"),"该账号尚未绑定为夜班日历成员。");} }
    else showLogin();
  }
  function showLogin(){$("loginPage").classList.remove("hidden");$("appPage").classList.add("hidden");}
  function showApp(){$("loginPage").classList.add("hidden");$("appPage").classList.remove("hidden");}

  async function enterApp(){
    const {data:memberId,error:memberIdError}=await db.rpc("current_member_id");
    if(memberIdError||!memberId) throw new Error("当前账号未绑定成员身份。");
    myMemberId=memberId;

    const {data:memberData,error:memberError}=await db.from("members").select("id,nickname,color");
    if(memberError) throw memberError;
    members=memberData||[];
    myMember=members.find(x=>x.id===myMemberId);
    if(!myMember) throw new Error("未找到当前成员资料。");

    $("currentUserName").textContent=myMember.nickname;
    showApp();
    await Promise.all([loadMonth(),loadNextMyShift()]);
  }

  $("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();location.reload();});

  async function loadMonth(){
    const year=calendarDate.getFullYear(),month=calendarDate.getMonth();
    await loadHolidayYear(year);
    const first=new Date(year,month,1),last=new Date(year,month+1,0);
    const {data,error}=await db.from("night_shifts")
      .select("id,member_id,shift_date,shift_type,note")
      .gte("shift_date",toYMD(first)).lte("shift_date",toYMD(last))
      .order("shift_date",{ascending:true});
    if(error){console.error(error);return;}
    shifts=data||[];
    await renderCalendar();
    await renderShiftList();
  }

  async function renderCalendar(){
    const year=calendarDate.getFullYear(),month=calendarDate.getMonth();
    $("calendarTitle").textContent=`${year}年${month+1}月`;
    const first=new Date(year,month,1),startOffset=first.getDay(),start=new Date(year,month,1-startOffset),todayYMD=toYMD(new Date());
    const grid=$("calendarGrid");grid.replaceChildren();

    for(let i=0;i<42;i++){
      const date=new Date(start);date.setDate(start.getDate()+i);
      const ymd=toYMD(date),cell=document.createElement("div");cell.className="day";
      if(date.getMonth()!==month) cell.classList.add("other-month");
      if(ymd===todayYMD) cell.classList.add("today");

      const holiday = await holidayForDate(ymd);
      if(holiday){
        cell.classList.add(holiday.type==="holiday"?"legal-holiday":"makeup-workday");
      }

      const number=document.createElement("div");number.className="day-number";number.textContent=date.getDate();cell.appendChild(number);

      if(holiday){
        const badge=document.createElement("span");
        badge.className=`holiday-badge ${holiday.type==="holiday"?"holiday":"workday"}`;
        badge.textContent=holiday.type==="holiday"?"休":"班";
        cell.appendChild(badge);

        const name=document.createElement("div");
        name.className="holiday-name";name.textContent=holiday.name;
        cell.appendChild(name);
      }

      const dayShifts=shifts.filter(s=>s.shift_date===ymd);
      if(dayShifts.length) cell.classList.add("has-shift");

      dayShifts.slice(0,2).forEach(shift=>{
        const member=memberById(shift.member_id);
        const chip=document.createElement("div");chip.className="shift-chip";
        const dot=document.createElement("span");dot.className="shift-dot";dot.style.backgroundColor=member?.color||"#aaa";
        const txt=document.createElement("span");txt.className="shift-chip-text";txt.textContent=`${member?.nickname||"成员"} ${shift.shift_type}`;
        chip.append(dot,txt);cell.appendChild(chip);
      });

      if(dayShifts.length>2){const more=document.createElement("div");more.className="shift-chip";more.textContent=`+${dayShifts.length-2}`;cell.appendChild(more);}

      if(date.getMonth()===month) cell.addEventListener("click",()=>openAddSheet(ymd));
      grid.appendChild(cell);
    }
  }

  async function renderShiftList(){
    const list=$("shiftList");list.replaceChildren();$("shiftCount").textContent=`共 ${shifts.length} 条`;
    if(!shifts.length){const e=document.createElement("div");e.className="empty";e.textContent="这个月还没有夜班记录";list.appendChild(e);return;}

    for(const shift of shifts){
      const member=memberById(shift.member_id),holiday=await holidayForDate(shift.shift_date);
      const item=document.createElement("article");item.className="shift-item";
      if(holiday?.type==="holiday") item.classList.add("holiday-shift");

      const left=document.createElement("div");left.className="shift-left";
      const person=document.createElement("div");person.className="shift-person";
      const dot=document.createElement("span");dot.className="person-dot";dot.style.backgroundColor=member?.color||"#aaa";
      const pt=document.createElement("span");pt.textContent=member?.nickname||"成员";person.append(dot,pt);

      const meta=document.createElement("div");meta.className="shift-meta";meta.textContent=`${formatChineseDate(shift.shift_date)} · ${shift.shift_type}`;
      left.append(person,meta);

      if(holiday){
        const h=document.createElement("div");
        h.className=`shift-holiday ${holiday.type==="holiday"?"holiday":"workday"}`;
        h.textContent=`${holiday.type==="holiday"?"休":"班"} · ${holiday.name}`;
        left.appendChild(h);
      }
      if(shift.note){const n=document.createElement("div");n.className="shift-note";n.textContent=shift.note;left.appendChild(n);}
      item.appendChild(left);

      if(shift.member_id===myMemberId){
        const actions=document.createElement("div");actions.className="actions";
        const edit=document.createElement("button");edit.className="small-btn";edit.textContent="编辑";edit.addEventListener("click",()=>openEditSheet(shift));
        const del=document.createElement("button");del.className="small-btn danger";del.textContent="删除";del.addEventListener("click",()=>deleteShift(shift));
        actions.append(edit,del);item.appendChild(actions);
      }
      list.appendChild(item);
    }
  }

  $("prevMonth").addEventListener("click",async()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);await loadMonth();});
  $("nextMonth").addEventListener("click",async()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);await loadMonth();});

  $("addShiftBtn").addEventListener("click",()=>openAddSheet(toYMD(new Date())));
  $("closeSheet").addEventListener("click",closeSheet);$("cancelShiftBtn").addEventListener("click",closeSheet);
  $("sheetOverlay").addEventListener("click",e=>{if(e.target===$("sheetOverlay"))closeSheet();});

  function openAddSheet(date){
    $("editingId").value="";$("sheetTitle").textContent="添加我的夜班";$("shiftDate").value=date;$("shiftType").value="夜班";$("shiftNote").value="";showError($("sheetError"),"");$("sheetOverlay").classList.remove("hidden");
  }
  function openEditSheet(shift){
    if(shift.member_id!==myMemberId)return;
    $("editingId").value=shift.id;$("sheetTitle").textContent="编辑我的夜班";$("shiftDate").value=shift.shift_date;$("shiftType").value=shift.shift_type;$("shiftNote").value=shift.note||"";showError($("sheetError"),"");$("sheetOverlay").classList.remove("hidden");
  }
  function closeSheet(){$("sheetOverlay").classList.add("hidden");}

  $("shiftForm").addEventListener("submit",async e=>{
    e.preventDefault();showError($("sheetError"),"");
    const date=$("shiftDate").value,type=$("shiftType").value,note=$("shiftNote").value.trim();
    if(!date){showError($("sheetError"),"请选择日期。");return;}
    if(note.length>100){showError($("sheetError"),"备注不能超过100字。");return;}
    $("saveShiftBtn").disabled=true;$("saveShiftBtn").textContent="正在保存…";
    try{
      let result;
      if($("editingId").value){
        result=await db.from("night_shifts").update({shift_date:date,shift_type:type,note:note||null}).eq("id",$("editingId").value);
      }else{
        result=await db.from("night_shifts").insert({member_id:myMemberId,shift_date:date,shift_type:type,note:note||null});
      }
      if(result.error)throw result.error;
      closeSheet();
      const saved=parseLocalDate(date);calendarDate=new Date(saved.getFullYear(),saved.getMonth(),1);
      await Promise.all([loadMonth(),loadNextMyShift()]);
    }catch(err){
      console.error(err);
      showError($("sheetError"),err.code==="23505"?"这一天已经存在相同班次。":"保存失败，请稍后再试。");
    }finally{$("saveShiftBtn").disabled=false;$("saveShiftBtn").textContent="保存";}
  });

  async function deleteShift(shift){
    if(shift.member_id!==myMemberId)return;
    if(!confirm(`确定删除 ${formatChineseDate(shift.shift_date)} 的「${shift.shift_type}」吗？`))return;
    const {error}=await db.from("night_shifts").delete().eq("id",shift.id);
    if(error){alert("删除失败，请稍后再试。");return;}
    await Promise.all([loadMonth(),loadNextMyShift()]);
  }

  async function loadNextMyShift(){
    const today=toYMD(new Date());
    const {data,error}=await db.from("night_shifts").select("id,shift_date,shift_type,note").eq("member_id",myMemberId).gte("shift_date",today).order("shift_date",{ascending:true}).limit(1);
    if(error){console.error(error);return;}
    nextShift=data?.[0]||null;
    const holidayEl=$("nextHoliday");holidayEl.textContent="";holidayEl.className="next-holiday";
    if(!nextShift){
      $("nextShiftDate").textContent="近期暂无夜班";$("nextShiftType").textContent="可以点击下方按钮添加";setCountdownEmpty();return;
    }
    $("nextShiftDate").textContent=formatChineseDate(nextShift.shift_date);$("nextShiftType").textContent=nextShift.shift_type;

    const holiday=await holidayForDate(nextShift.shift_date);
    if(holiday){
      holidayEl.classList.add(holiday.type==="holiday"?"holiday":"workday");
      holidayEl.textContent=`${holiday.type==="holiday"?"休":"班"} · ${holiday.name}`;
    }
    startCountdown();
  }

  function setCountdownEmpty(){["cdDays","cdHours","cdMinutes","cdSeconds"].forEach(id=>$(id).textContent="--");}
  function startCountdown(){if(countdownTimer)clearInterval(countdownTimer);updateCountdown();countdownTimer=setInterval(updateCountdown,1000);}
  function updateCountdown(){
    if(!nextShift)return;
    const target=parseLocalDate(nextShift.shift_date),now=new Date();
    if(toYMD(target)===toYMD(now)){$("cdDays").textContent="今";$("cdHours").textContent=$("cdMinutes").textContent=$("cdSeconds").textContent="00";return;}
    const diff=Math.max(target-now,0);
    $("cdDays").textContent=Math.floor(diff/86400000);
    $("cdHours").textContent=pad2(Math.floor((diff%86400000)/3600000));
    $("cdMinutes").textContent=pad2(Math.floor((diff%3600000)/60000));
    $("cdSeconds").textContent=pad2(Math.floor((diff%60000)/1000));
  }

  db.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")showLogin();});
  init();
</script>
</body>
</html>
