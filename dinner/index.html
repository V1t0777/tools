
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#f7f3ed" />
  <title>今晚吃什么</title>
  <style>
    :root{
      --bg1:#fffaf4;
      --bg2:#f3f6fb;
      --text:#202533;
      --muted:#7c8495;
      --card:rgba(255,255,255,.78);
      --shadow:0 18px 50px rgba(51,61,87,.14);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
    body{
      min-height:100dvh;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,196,144,.28), transparent 30%),
        radial-gradient(circle at 95% 5%, rgba(163,195,255,.25), transparent 28%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }
    .app{
      width:min(720px,100%);
      min-height:100dvh;
      margin:0 auto;
      padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:var(--text);
      text-decoration:none;
      font-weight:700;
      background:rgba(255,255,255,.74);
      border:1px solid rgba(255,255,255,.9);
      box-shadow:0 8px 24px rgba(50,60,80,.10);
      border-radius:16px;
      padding:11px 14px;
      backdrop-filter:blur(16px);
    }
    .tiny{font-size:13px;color:var(--muted)}
    header{
      text-align:center;
      padding:24px 0 12px;
    }
    h1{
      margin:0;
      font-size:clamp(34px,9vw,54px);
      font-weight:900;
      letter-spacing:.02em;
    }
    .sub{
      margin:9px 0 0;
      color:var(--muted);
      font-size:15px;
    }
    .stage{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:8px 0 18px;
    }
    .wheel-wrap{
      position:relative;
      width:min(82vw,430px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }
    .pointer{
      position:absolute;
      z-index:5;
      top:-7px;
      left:50%;
      transform:translateX(-50%);
      width:0;height:0;
      border-left:16px solid transparent;
      border-right:16px solid transparent;
      border-top:30px solid #222a3a;
      filter:drop-shadow(0 5px 8px rgba(0,0,0,.20));
    }
    canvas{
      width:100%;
      height:100%;
      border-radius:50%;
      filter:drop-shadow(0 18px 30px rgba(49,58,80,.20));
      transform:rotate(0deg);
      will-change:transform;
    }
    .spin-btn{
      position:absolute;
      z-index:4;
      width:108px;
      height:108px;
      border-radius:50%;
      border:8px solid rgba(255,255,255,.9);
      background:linear-gradient(180deg,#222b3e,#151b29);
      color:white;
      font-size:22px;
      font-weight:900;
      box-shadow:0 12px 30px rgba(18,25,38,.25);
      cursor:pointer;
      touch-action:manipulation;
    }
    .spin-btn:active{transform:scale(.96)}
    .spin-btn:disabled{opacity:.75}
    .result-card{
      margin-top:22px;
      width:min(92vw,430px);
      min-height:92px;
      padding:16px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:var(--card);
      border:1px solid rgba(255,255,255,.92);
      border-radius:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      text-align:center;
    }
    .result-label{font-size:13px;color:var(--muted);margin-bottom:5px}
    .result{
      font-size:30px;
      font-weight:900;
      min-height:39px;
    }
    .hint{
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
      line-height:1.55;
    }
    @media (max-height:700px){
      header{padding:14px 0 5px}
      .wheel-wrap{width:min(67vh,78vw)}
      .result-card{margin-top:12px;min-height:76px}
      .result{font-size:26px}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="../" aria-label="返回工具箱">← 返回工具箱</a>
      <div class="tiny">三选一 · 等概率</div>
    </div>

    <header>
      <h1>今晚吃什么</h1>
      <p class="sub">烧烤 · 火锅 · 炒菜，每项概率均为 1/3</p>
    </header>

    <section class="stage">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900" aria-label="今晚吃什么转盘"></canvas>
        <button id="spinBtn" class="spin-btn">开转</button>
      </div>

      <div class="result-card">
        <div class="result-label">今晚就吃</div>
        <div id="result" class="result">点击转盘开始</div>
      </div>

      <div class="hint">每次先等概率随机选中一项，再让转盘旋转到对应区域；动画不会改变抽取概率。</div>
    </section>
  </main>

  <script>
    const options = [
      { name: "烧烤", emoji: "🍢", color: "#ffb36a" },
      { name: "火锅", emoji: "🍲", color: "#ff7f72" },
      { name: "炒菜", emoji: "🥘", color: "#85d39b" }
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const btn = document.getElementById("spinBtn");
    const resultEl = document.getElementById("result");

    const TWO_PI = Math.PI * 2;
    const slice = TWO_PI / options.length;
    let currentRotation = 0;
    let spinning = false;

    function drawWheel(){
      const c = canvas.width / 2;
      const r = c - 18;
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // 外圈
      ctx.beginPath();
      ctx.arc(c,c,r+8,0,TWO_PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      options.forEach((opt,i)=>{
        // 让第一个扇区以正上方为中心，方便指针定位
        const centerAngle = -Math.PI/2 + i * slice;
        const start = centerAngle - slice/2;
        const end = centerAngle + slice/2;

        ctx.beginPath();
        ctx.moveTo(c,c);
        ctx.arc(c,c,r,start,end);
        ctx.closePath();
        ctx.fillStyle = opt.color;
        ctx.fill();

        ctx.save();
        ctx.translate(c,c);
        ctx.rotate(centerAngle);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = "700 46px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        ctx.fillStyle = "#1f2533";
        ctx.fillText(opt.name, r*0.62, -4);

        ctx.font = "58px Apple Color Emoji, Segoe UI Emoji";
        ctx.fillText(opt.emoji, r*0.62, 58);
        ctx.restore();
      });

      // 分割线
      ctx.strokeStyle = "rgba(255,255,255,.86)";
      ctx.lineWidth = 10;
      options.forEach((_,i)=>{
        const a = -Math.PI/2 - slice/2 + i*slice;
        ctx.beginPath();
        ctx.moveTo(c,c);
        ctx.lineTo(c+Math.cos(a)*r, c+Math.sin(a)*r);
        ctx.stroke();
      });

      // 中心装饰
      ctx.beginPath();
      ctx.arc(c,c,103,0,TWO_PI);
      ctx.fillStyle = "rgba(255,255,255,.96)";
      ctx.fill();
    }

    function cryptoRandomIndex(max){
      if (window.crypto && crypto.getRandomValues){
        const limit = Math.floor(0x100000000 / max) * max;
        const buf = new Uint32Array(1);
        do {
          crypto.getRandomValues(buf);
        } while (buf[0] >= limit);
        return buf[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function spin(){
      if(spinning) return;
      spinning = true;
      btn.disabled = true;
      resultEl.textContent = "正在决定…";

      const winner = cryptoRandomIndex(options.length);

      // 指针固定正上方。要让 winner 的扇区中心转到正上方，
      // 需要将画布转过 -winner * 120°（再加若干整圈）。
      const baseTurns = 5 + Math.floor(Math.random()*3);
      const targetNormalized = ((-winner * 120) % 360 + 360) % 360;
      const currentNormalized = ((currentRotation % 360) + 360) % 360;
      let delta = targetNormalized - currentNormalized;
      if(delta < 0) delta += 360;
      const target = currentRotation + baseTurns*360 + delta;

      canvas.style.transition = "transform 4.6s cubic-bezier(.12,.72,.16,1)";
      canvas.style.transform = `rotate(${target}deg)`;
      currentRotation = target;

      setTimeout(()=>{
        resultEl.textContent = `${options[winner].emoji} ${options[winner].name}`;
        if (navigator.vibrate) navigator.vibrate([35,45,35]);
        btn.disabled = false;
        spinning = false;
      }, 4650);
    }

    btn.addEventListener("click", spin, {passive:true});
    drawWheel();
  </script>
</body>
</html>
