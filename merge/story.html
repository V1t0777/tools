<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ede1">
  <meta name="description" content="云屿百物铺第一卷可玩剧情预览：主线、人物支线与每日岛屿事件。">
  <title>云屿百物铺 · 潮声初起</title>
  <link rel="stylesheet" href="./story/story.css">
  <script type="module" src="./story/ui.mjs"></script>
</head>
<body>
<div class="story-shell">
  <header class="top">
    <a class="back" href="./index.html" aria-label="返回百物铺普通经营模式">← 返回经营</a>
    <span class="eyebrow">ISLE CHRONICLES · STORY PREVIEW</span>
  </header>
  <main>
    <section class="hero" aria-labelledby="story-title">
      <p class="kicker">第一卷 · 潮声初起</p>
      <h1 id="story-title">云屿来信</h1>
      <p class="lead">起初，你只是重新打开一家店。后来，你遇见了一整座岛上的人。</p>
      <div class="scenery" role="img" aria-label="海面、层叠的山丘和被晨光照亮的海边杂货铺示意场景">
        <span class="sun"></span><span class="hill far"></span><span class="hill near"></span>
        <span class="water"></span><span class="shop"></span><span class="shop-roof"></span>
        <span class="scene-label">海风正好，故事从这里开始。</span>
      </div>
    </section>
    <section class="notice-panel" aria-label="游玩与存档说明">
      <p>独立剧情体验 · 阅读不消耗体力 · 与普通经营存档隔离 · 仅保存于当前浏览器</p>
      <p id="save-state" role="status" aria-live="polite"></p>
      <a class="back" href="./story-workshop.html">🧺 前往剧情专属合成台（完成真实委托） →</a>
    </section>
    <section class="progress" aria-label="主线进度">
      <div class="progress-heading"><h2>百物手账</h2><span id="progress-count">0 / 12</span></div>
      <div class="track" role="progressbar" aria-label="主线完成进度" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="progress-track"><span id="progress-fill"></span></div>
      <p id="chapter-hint" class="chapter-hint">清晨，新的旅程将要开始。</p>
    </section>
    <section class="stories" aria-labelledby="entries-title">
      <h2 id="entries-title">岛上的故事</h2>
      <p class="muted">主线推进时会自然解锁人物故事。每天还会出现一则轻量岛屿事件。</p>
      <div class="tabs" role="group" aria-label="故事分类">
        <button type="button" data-kind="main" aria-pressed="true">主线</button>
        <button type="button" data-kind="side" aria-pressed="false">人物支线</button>
        <button type="button" data-kind="incident" aria-pressed="false">今日事件</button>
      </div>
      <div id="story-list" class="story-list" aria-live="polite"></div>
    </section>
    <div class="foot-actions">
      <button id="reset-story" type="button" class="quiet">重置当前浏览器的剧情进度</button>
      <a href="./index.html">返回普通经营模式 →</a>
    </div>
  </main>
  <footer>剧情体验预览 · 非完整发行版本 · 后续篇章将通过独立故事包扩展</footer>
</div>
<dialog id="story-dialog" aria-labelledby="dialog-title">
  <div class="dialog-inner">
    <div class="dialog-top"><span id="dialog-chapter"></span><button id="close-dialog" type="button" aria-label="关闭故事">✕</button></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-place" class="muted"></p>
    <div id="dialog-lines" class="dialog-lines"></div>
    <div id="dialog-choices" class="dialog-choices"></div>
    <p id="dialog-reply" role="status" aria-live="polite"></p>
    <button id="complete-story" class="complete" type="button">完成阅读</button>
  </div>
</dialog>
</body>
</html>
